          for(var i=0;i<a.length;i++){
            x+=a[i][0]; y+=a[i][1];
            pts.push([x*tr.scale[0]+tr.translate[0], y*tr.scale[1]+tr.translate[1]]);
          }
          return neg?pts.slice().reverse():pts;
        }
        function anillo(ids){
          var pts=[];
          ids.forEach(function(ai){ var s=decodifica(ai); pts=pts.concat(pts.length?s.slice(1):s); });
          return pts;
        }
        var dPath=[];
        obj.geometries.forEach(function(g){
          var polys = g.type==='Polygon'?[g.arcs]:g.arcs;
          polys.forEach(function(poly){
            poly.forEach(function(ids){
              var pts=anillo(ids), s='';
              for(var i=0;i<pts.length;i++){
                var q=proy(pts[i][1], pts[i][0]);
                s += (i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1);
              }
              if(s) dPath.push(s+'Z');
            });
          });
        });
        var tierra=nodo('path','m-tierra');
        tierra.setAttribute('d', dPath.join(' '));
        gTierra.appendChild(tierra);
      })
      .catch(function(){ });

    var cuenta=$('#m-cuenta');
    if(cuenta){
      var nH=lugares.reduce(function(s,L){return s+L.hechos.length},0);
      cuenta.textContent = nH+' '+T[lang].m_hechos+' · '+lugares.length+' '+(lang==='es'?'lugares':'places');
    }
    return {limpiar:limpiar};
  })();

  function pintaHoy(){
    var pasos=$('#pasos');pasos.innerHTML='';
    var act=1; // atencion humanitaria
    T[lang].fases.forEach(function(f,i){
      var d=el('div','p'+(i===act?' act':''));
      d.appendChild(el('span','dot'));
      d.appendChild(el('span','num','0'+(i+1)));
      d.appendChild(el('span','lbl',esc(f)));
      if(i===act)d.appendChild(el('span','aqui',esc(T[lang].aqui)));
      pasos.appendChild(d);
    });
    $('#avance').style.width='50%';
    var p=$('#perdida');p.innerHTML='';
    CTX.forEach(function(x){
      var d=el('div','pf');
      d.appendChild(el('span','n',x[0]));
      d.appendChild(el('span','t',esc(lang==='es'?x[1]:x[2])));
      d.appendChild(el('span','s','UNGRD · 15 ago'));
      p.appendChild(d);
    });
    $('#nota_hoy').innerHTML = lang==='es'
      ? 'Balance de la UNGRD con corte al 15 de agosto de 2026. El epicentro fue San José del Palmar, en el Chocó, un departamento con 30,8% de pobreza multidimensional frente a un promedio nacional de 9,9%, <a href="https://www.dane.gov.co/files/operaciones/PM/bol-PMultidimensional-2025.pdf" target="_blank" rel="noopener">según el DANE</a>.'
      : 'Figures from Colombia’s national disaster agency (UNGRD) as of August 15, 2026. The epicentre was San José del Palmar, in Chocó, a department where 30.8% of people live in multidimensional poverty against a national average of 9.9%, <a href="https://www.dane.gov.co/files/operaciones/PM/bol-PMultidimensional-2025.pdf" target="_blank" rel="noopener">per the national statistics office</a>.';
  }

  function pintaEjes(){
    var box=$('#ejes');box.innerHTML='';
    EJES.forEach(function(e){
      var b=el('button','eje');
      b.setAttribute('aria-pressed',abierto===e.k?'true':'false');
      b.appendChild(el('span','mk',e.mk));
      b.appendChild(el('span','nm',esc(L(e,'nm'))));
      b.appendChild(el('span','ds',esc(L(e,'ds'))));
      b.addEventListener('click',function(ev){
        abierto = (abierto===e.k) ? null : e.k;
        pintaEjes();pintaPanel();
        if(ev.isTrusted&&abierto)$('#panel').scrollIntoView({behavior:'smooth',block:'nearest'});
      });
      box.appendChild(b);
    });
  }
  function pintaPanel(){
    var p=$('#panel');p.innerHTML='';
    if(!abierto)return;
    var d=OPC[abierto];
    var lista=(d.o||[]).slice();
    if(modo==='intl'){lista.sort(function(a,b){
      var A=(a.tag==='mundo'||a.siempre)?0:1,B=(b.tag==='mundo'||b.siempre)?0:1;return A-B;})}
    lista.forEach(function(o){
      var c=el('article','op'+(o.aviso?' aviso':''));
      c.appendChild(el('span','tg',esc(o.tag==='mundo'
        ?(lang==='es'?'Desde cualquier país':'From anywhere in the world')
        :(lang==='es'?'Presencial en Colombia':'In person, in Colombia'))));
      c.appendChild(el('h3',null,esc(L(o,'n'))));
      c.appendChild(el('p','d',esc(L(o,'d'))));
      var a=el('a','a',esc(L(o,'a')));
      if(o.url){a.href=o.url;a.target='_blank';a.rel='noopener'}
      else if(o.correo){a.href='mailto:'+CORREO+'?subject='+encodeURIComponent(T[lang].asu)+'&body='+encodeURIComponent(T[lang].bsu)}
      else if(o.copiar){
        a.href='#sumar';
        a.addEventListener('click',function(ev){
          if(!ev.isTrusted)return;
          ev.preventDefault();
          var u=location.href.split('#')[0];
          if(navigator.clipboard&&navigator.clipboard.writeText){
            navigator.clipboard.writeText(u).then(function(){a.textContent=lang==='es'?'Enlace copiado ✓':'Link copied ✓'},function(){a.textContent=u});
          } else { a.textContent=u; }
        });
      }
      c.appendChild(a);
      // Una tarjeta puede llevar varias marcas detras, como las campanas
      // colectivas. Se listan con su propio enlace: si la gente les compra,
      // la campana recoge mas. El texto se escapa como todo lo demas.
      if(o.marcas && o.marcas.length){
        var fila=el('p','marcas');
        o.marcas.forEach(function(m,i){
          if(i) fila.appendChild(document.createTextNode('  ·  '));
          var ml=el('a',null,esc(m.n));
          ml.href=m.url; ml.target='_blank'; ml.rel='noopener';
          fila.appendChild(ml);
        });
        c.appendChild(fila);
      }
      c.appendChild(el('span','f',esc(o.f)));
      p.appendChild(c);
    });
  }

  function pintaRecursos(){
    var box=$('#recursos');box.innerHTML='';
    RECURSOS.forEach(function(r){
      var c=el('article','re');
      c.appendChild(el('h3',null,esc(L(r,'n'))));
      c.appendChild(el('p',null,esc(L(r,'d'))));
      var a=el('a',null,esc(L(r,'a')));
      if(r.url){a.href=r.url;a.target='_blank';a.rel='noopener'}
      c.appendChild(a);
      c.appendChild(el('span','f',esc(r.f||'')));
      box.appendChild(c);
    });
  }

  function pintaConciertos(){
    var box=$('#conciertos');box.innerHTML='';
    var hoy=new Date();
    CONCIERTOS.forEach(function(k){
      var paso = k.iso ? (new Date(k.iso+'T23:59:00') < hoy) : false;
      var c=el('article','co'+(paso?' pasado':''));
      c.appendChild(el('span','fch',esc(L(k,'f'))));
      c.appendChild(el('h3',null,esc(k.nm)));
      c.appendChild(el('span','lug',esc(L(k,'lug'))));
      c.appendChild(el('p','art',esc(L(k,'art'))));
      if(paso)c.appendChild(el('span','ya',esc(T[lang].pasado)));
      var fin=el('div','fin');
      fin.appendChild(el('span','dst',esc(L(k,'destino'))));
      if(L(k,'precio'))fin.appendChild(el('span','prc',esc(L(k,'precio'))));
      c.appendChild(fin);
      box.appendChild(c);
    });
  }

  function pintaTransp(){
    var d=$('#destacadas');d.innerHTML='';
    TRANSP.forEach(function(x){
      var a=el('article');
      a.appendChild(el('h3',null,esc(L(x,'q'))));
      a.appendChild(el('p',null,esc(L(x,'a'))));
      d.appendChild(a);
    });
    // Cada fuente es [titulo, url]. Van como enlaces, no como texto pegado:
    // volcar la URL cruda era justo lo contrario de lo que promete el sitio.
    var s=$('#srcs');s.innerHTML='';
    FUENTES.forEach(function(f,i){
      var nombre=Array.isArray(f)?f[0]:(f&&f.n?f.n:String(f));
      var url=Array.isArray(f)?f[1]:(f&&f.u?f.u:null);
      if(url){
        var a=el('a',null,esc(nombre)); a.href=url; a.target='_blank'; a.rel='noopener';
        s.appendChild(a);
      } else { s.appendChild(el('span',null,esc(nombre))); }
    });
    $('#f2').textContent = lang==='es'
      ? TOTAL_HECHOS+' hechos verificados, de '+TOTAL_FUENTES+' fuentes distintas. Todo el código y todos los datos son públicos y auditables.'
      : TOTAL_HECHOS+' verified facts, from '+TOTAL_FUENTES+' different sources. All the code and all the data are public and auditable.';
  }

  function aplicaModo(){
    document.querySelectorAll('[data-modo]').forEach(function(b){
      b.setAttribute('aria-pressed', b.getAttribute('data-modo')===modo?'true':'false');
    });
    pintaPanel();pintaFlujo();
  }

  function aplica(){
    document.documentElement.lang=lang;
    Object.keys(T[lang]).forEach(function(k){
      var n=document.querySelector('[data-i="'+k+'"]');
      if(n) n.innerHTML=T[lang][k];
    });
    document.querySelectorAll('[data-modo]').forEach(function(b){
      b.textContent=T[lang]['m_'+b.getAttribute('data-modo')];
    });
    $('#kicker').textContent=T[lang].kicker;
    [['#mk1','mk1'],['#mk2','mk2'],['#mk3','mk3'],['#bk1','mk1'],['#bk2','mk2'],['#bk3','mk3']].forEach(function(par){
      var n=document.querySelector(par[0]); if(n) n.textContent=T[lang][par[1]];
    });
    var sb=$('#sumbtn');
    sb.textContent=T[lang].b_sum;
    sb.href='mailto:'+CORREO+'?subject='+encodeURIComponent(T[lang].asu)+'&body='+encodeURIComponent(T[lang].bsu);
    $('#b-es').setAttribute('aria-pressed',lang==='es'?'true':'false');
    $('#b-en').setAttribute('aria-pressed',lang==='en'?'true':'false');
    document.title = lang==='es'
      ? 'Desde Donde Estés · Cómo ayudar tras el terremoto en Colombia'
      : 'From Wherever You Are · How to help after the Colombia earthquake';
    // Las dos cifras del medidor van enlazadas a su fuente, como cualquier
    // otro dato del sitio: la del ANDI a El Heraldo, y la de la reconstruccion
    // a La Republica, que publica la estimacion inicial de BTG Pactual.
    var ley=$('#leyenda');ley.innerHTML='';
    var U_ANDI='https://www.elheraldo.co/economia/2026/08/14/las-donaciones-de-los-empresarios-de-colombia-superaron-cifra-historica-de-200-mil-millones/';
    var U_REC='https://www.larepublica.co/especiales/catastrofe-nacional/la-reconstruccion-por-el-terremoto-costaria-us-6-350-millones-lo-que-equivale-a-1-del-pib-4457501';
    ley.appendChild(el('span',null,lang==='es'
      ? '$201.637 millones donados por empresas colombianas vía ANDI · <a href="'+U_ANDI+'" target="_blank" rel="noopener">El Heraldo, 14 ago</a>'
      : 'about US$64 million given by Colombian businesses through ANDI · <a href="'+U_ANDI+'" target="_blank" rel="noopener">El Heraldo, Aug 14</a>'));
    ley.appendChild(el('span',null,lang==='es'
      ? '$20 billones (US$6.350 millones, cerca del 1% del PIB): estimación inicial del costo de la reconstrucción hecha por BTG Pactual · <a href="'+U_REC+'" target="_blank" rel="noopener">La República, 13 ago</a>'
      : 'COP $20 trillion (US$6.35 billion, about 1% of GDP): BTG Pactual’s initial estimate of the cost of rebuilding · <a href="'+U_REC+'" target="_blank" rel="noopener">La República, Aug 13</a>'));
    frescura();pintaCifras();pintaFiltros();pintaFlujo();pintaReels();
    pintaHoy();pintaEjes();pintaPanel();pintaRecursos();pintaConciertos();pintaTransp();
  }

  $('#b-es').addEventListener('click',function(){lang='es';aplica()});
  $('#b-en').addEventListener('click',function(){lang='en';aplica()});
  document.querySelectorAll('[data-modo]').forEach(function(b){
    b.addEventListener('click',function(){modo=b.getAttribute('data-modo');aplicaModo()});
  });
  $('#masbtn').addEventListener('click',function(){
    var lista=H.filter(pasaFiltro);
    tope = tope>=lista.length ? 12 : tope+12;
    pintaFlujo();
  });

  // Ubicacion por zona horaria, leida en el propio navegador. No sale ni un
  // dato del dispositivo: sin cookies, sin IP, sin terceros. Si no se puede
  // saber, se asume "fuera de Colombia", que es la version que funciona
  // desde cualquier parte.
  var enColombia=false;
  try{
    var tz=(Intl.DateTimeFormat().resolvedOptions().timeZone||'');
    enColombia = tz.indexOf('Bogota')!==-1;
  }catch(e){ enColombia=false; }
  modo = enColombia ? 'co' : 'intl';

  // El idioma arranca en espanol siempre, salvo un caso: que el navegador no
  // este en espanol Y ademas la zona horaria no sea la de Colombia. Muchos
  // colombianos tienen el telefono en ingles, y a alguien en Colombia el sitio
  // tiene que abrirle en espanol asi su celular este en otro idioma.
  var idiomaNavegador=(navigator.language||'').slice(0,2).toLowerCase();
  if(!enColombia && idiomaNavegador && idiomaNavegador!=='es') lang='en';

  aplica();aplicaModo();
})();
</script>
