<style>
  :root{
    --amarillo:#F2C230; --amarillo-claro:#FBE9AE; --amarillo-hondo:#8A6A0E; --amarillo-papel:#FDF6E2;
    --azul:#12356B; --tinta:#16203A; --tinta-2:#4A5670; --tinta-3:#8896B2;
    --rojo:#C4362B;
    --papel:#FBF8F1; --papel-2:#F3EDE0; --tarjeta:#FFFDF7;
    --linea:#E4DCCB; --linea-2:#CFC5AF;
    --verde-fondo:#E8F2EC; --verde-linea:#B9D5C6; --verde-tarjeta:#F4FAF6;
    --verde-hondo:#1F4A37; --verde:#2F6B4F; --verde-texto:#2A4A3A;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{margin:0;padding:0}
  body{background:var(--papel);color:var(--tinta);
    font:17px/1.55 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--tinta);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;text-decoration-color:var(--linea-2)}
  a:hover{color:var(--amarillo-hondo);text-decoration-color:var(--amarillo)}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--azul);outline-offset:3px}
  ::selection{background:var(--amarillo-claro);color:var(--tinta)}
  h1,h2,h3{margin:0;font-weight:400}
  [hidden]{display:none!important}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px}

  /* barra */
  .barra{position:sticky;top:0;z-index:40;background:var(--papel);border-bottom:1px solid var(--linea)}
  .barra .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-top:13px;padding-bottom:13px}
  .marca{text-decoration:none;display:flex;align-items:center;gap:10px;flex:none}
  .bandera{display:flex;flex-direction:column;width:20px;height:20px;flex:none}
  .bandera i{display:block}
  .bandera i:nth-child(1){height:50%;background:var(--amarillo)}
  .bandera i:nth-child(2){height:25%;background:var(--azul)}
  .bandera i:nth-child(3){height:25%;background:var(--rojo)}
  .marca .w{font-family:var(--serif);font-size:19px;display:flex;gap:5px}
  .marca .w i{font-style:normal}
  .marca .w i:nth-child(1){color:var(--amarillo-hondo)}
  .marca .w i:nth-child(2){color:var(--azul)}
  .marca .w i:nth-child(3){color:var(--rojo)}
  .relleno{flex:1}
  .sw{display:flex;gap:9px;align-items:baseline;font-size:14px}
  .sw button{border:0;background:transparent;padding:0 0 2px;cursor:pointer;color:var(--tinta-2);border-bottom:2px solid transparent}
  .sw button[aria-pressed="true"]{color:var(--tinta)}
  .sw.lang button[aria-pressed="true"]{border-bottom-color:var(--amarillo)}
  .sw.loc button[aria-pressed="true"]{border-bottom-color:var(--azul)}
  .sw .sep{color:var(--linea-2)}
  .cta{font-size:14.5px;padding:7px 15px;background:var(--amarillo);color:var(--tinta);text-decoration:none;white-space:nowrap}
  .cta:hover{color:var(--tinta)}

  .frescura{background:var(--amarillo-claro);border-bottom:1px solid var(--linea)}
  .frescura p{margin:0;padding:8px 24px;max-width:1200px;margin:0 auto;font-size:13.5px;color:var(--amarillo-hondo)}

  section{border-bottom:1px solid var(--linea);scroll-margin-top:74px}
  .banda{background:var(--papel-2)}
  .enc{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline;margin-bottom:30px}
  .enc h2{font-family:var(--serif);font-size:clamp(27px,3.4vw,38px);line-height:1.12}
  .enc p{margin:0;color:var(--tinta-2);font-size:15px}

  /* apertura */
  .top .wrap{padding-top:46px;padding-bottom:52px}
  .kicker{margin:0 0 20px;font-size:14px;color:var(--tinta-2);letter-spacing:.03em}
  .masthead{position:relative}
  .mapa{position:absolute;right:0;top:-6%;width:min(52%,560px);opacity:.42;pointer-events:none}
  .masthead h1{position:relative;font-family:var(--serif);font-size:clamp(58px,14vw,158px);line-height:.87;letter-spacing:-.03em}
  .masthead h1 span{display:block}
  .masthead h1 span:nth-child(1){color:var(--amarillo-hondo)}
  .masthead h1 span:nth-child(2){color:var(--azul);margin-left:7%}
  .masthead h1 span:nth-child(3){color:var(--rojo);margin-left:14%}
  .bajo{margin-top:clamp(34px,6vw,66px);display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,64px)}
  .cita{margin:0;flex:2 1 380px;font-family:var(--serif);font-size:clamp(22px,2.6vw,29px);line-height:1.38;border-left:3px solid var(--amarillo);padding-left:24px}
  .cita .firma{margin-top:20px;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15.5px;color:var(--tinta-2);line-height:1.5}
  .acc{flex:1 1 300px;display:flex;flex-direction:column;justify-content:flex-end;gap:22px}
  .acc .posib{margin:0;font-size:18px;line-height:1.6}
  .acc .fila{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .btn{padding:13px 20px;background:var(--tinta);color:var(--papel);text-decoration:none;font-size:15.5px;border:0;cursor:pointer;display:inline-block}
  .btn:hover{color:var(--papel);background:#22304f}
  .btn.am{background:var(--amarillo);color:var(--tinta)}
  .btn.am:hover{background:#e8b724;color:var(--tinta)}
  .btn.claro{background:transparent;border:1px solid var(--linea-2);color:var(--tinta)}
  .enlace{font-size:15.5px;color:var(--tinta-2)}

  /* cifras */
  .cifras{display:flex;flex-wrap:wrap;gap:26px clamp(24px,4vw,52px)}
  .cif{flex:1 1 210px;display:flex;flex-direction:column;gap:9px}
  .cif .n{font-family:var(--serif);font-size:clamp(40px,5vw,60px);line-height:.92;letter-spacing:-.02em}
  .cif .n small{font-size:.42em;letter-spacing:0}
  .cif .t{font-size:15.5px;line-height:1.45}
  .cif a{font-size:12.5px;color:var(--tinta-2)}

  /* cadena */
  .cadena .wrap{padding-top:52px;padding-bottom:56px}
  .enc.ancho{align-items:flex-end;gap:16px 40px;margin-bottom:26px}
  .enc.ancho h2{flex:1 1 340px;font-size:clamp(30px,4.4vw,50px);line-height:1.05;max-width:17ch}
  .enc.ancho p{flex:1 1 280px;font-size:15.5px;max-width:44ch}
  .filtros{display:flex;gap:20px;flex-wrap:wrap;font-size:14.5px;padding-bottom:12px}
  .filtros button{border:0;background:transparent;padding:0 0 4px;cursor:pointer;color:var(--tinta-2);border-bottom:2px solid transparent}
  .filtros button[aria-pressed="true"]{color:var(--tinta);border-bottom-color:var(--amarillo)}
  .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(274px,1fr));gap:16px}
  .ficha{position:relative;border:1px solid var(--linea);background:var(--tarjeta);padding:22px 20px 14px;display:flex;flex-direction:column;gap:9px}
  .ficha h3{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;line-height:1.45}
  .ficha .cifra{margin:0;font-family:var(--serif);font-size:22px;line-height:1.26}
  .ficha .que{margin:0;font-size:15px;line-height:1.5;color:var(--tinta-2);flex:1}
  .ficha .pie{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;padding-top:9px;border-top:1px solid var(--linea);font-size:12.5px;color:var(--tinta-2)}
  .ficha .pie a{color:var(--tinta-2)}
  .masbox{padding-top:18px}

  /* reels */
  .reels-cab{margin-top:52px;padding-top:20px;border-top:1px solid var(--linea);display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .reels-cab h3{margin:0;font-family:var(--serif);font-size:clamp(22px,2.4vw,30px);font-weight:400;line-height:1.15}
  .reels-cab p{margin:6px 0 0;font-size:14.5px;color:var(--tinta-2);max-width:52ch}
  .reels-nav{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .reels-nav .cuenta{font-size:13px;color:var(--tinta-2);min-width:46px;text-align:right}
  .reels-nav button{width:40px;height:40px;border:1px solid var(--linea-2);background:transparent;color:var(--tinta);font-size:15px;line-height:1;cursor:pointer}
  .reels-nav button:hover:not([disabled]){background:var(--papel-2)}
  .reels-nav button[disabled]{opacity:.3;cursor:default}
  .reels{margin-top:22px;display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:12px;scrollbar-width:thin}
  .reel{flex:0 0 300px;scroll-snap-align:start}
  @media(max-width:700px){.reel{flex:0 0 78vw}.reels-nav{display:none}}
  .reel .marco{position:relative;width:100%;aspect-ratio:4/5;background:var(--papel-2);border:1px solid var(--linea);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .reel .marco iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .reel .esperando{font-size:13px;color:var(--tinta-2);padding:16px;text-align:center}
  .reel .cap{margin:11px 0 0;font-size:14.5px;line-height:1.5;color:var(--tinta-2)}
  .reel .abrir{font-size:13px}

  /* fase */
  .fase{position:relative;padding-top:26px}
  .fase .riel{position:absolute;left:0;right:0;top:26px;height:2px;background:var(--linea)}
  .fase .avance{position:absolute;left:0;top:26px;height:2px;background:var(--amarillo)}
  .fase .pasos{position:relative;display:flex}
  .fase .p{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 8px}
  .fase .dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--papel);margin-top:-6px;background:var(--linea-2)}
  .fase .p.act .dot{background:var(--rojo)}
  .fase .num{font-size:12.5px;color:var(--tinta-2);font-family:var(--serif)}
  .fase .lbl{font-size:19px;font-family:var(--serif);line-height:1.2}
  .fase .aqui{font-size:13px;color:var(--amarillo-hondo)}
  .perdida{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(224px,1fr));gap:16px}
  .pf{position:relative;border:1px solid var(--linea);background:var(--tarjeta);padding:20px 18px 16px;display:flex;flex-direction:column;gap:7px}
  .pf .n{font-family:var(--serif);font-size:32px;line-height:1;color:var(--tinta-2)}
  .pf .t{font-size:14.5px;line-height:1.45;color:var(--tinta-2);flex:1}
  .pf .s{font-size:12.5px;color:var(--tinta-2);padding-top:8px;border-top:1px solid var(--linea)}
  .nota{margin:26px 0 0;font-size:14px;line-height:1.6;color:var(--tinta-2);max-width:78ch}

  /* sumar */
  .sumar{background:var(--amarillo-papel)}
  .sumar .wrap{padding-top:50px;padding-bottom:54px;display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,56px)}
  .sumar .izq{flex:1 1 300px}
  .sumar h2{font-family:var(--serif);font-size:clamp(28px,3.8vw,44px);line-height:1.08;max-width:15ch;margin-bottom:12px}
  .sumar .izq p{margin:0;color:var(--amarillo-hondo);font-size:15.5px;max-width:38ch}
  .sumar .der{flex:1.4 1 340px}
  .sumar .der .p1{margin:0 0 18px;font-size:17.5px;line-height:1.62}
  .sumar .der .p2{margin:0 0 24px;font-size:14.5px;line-height:1.6;color:var(--tinta-2)}

  /* puertas */
  .puertas{background:var(--papel-2)}
  .puertas .wrap{padding-top:52px;padding-bottom:58px}
  .puertas .enc{gap:14px 40px;align-items:flex-end;margin-bottom:32px}
  .puertas .enc h2{font-size:clamp(34px,5vw,62px);line-height:1}
  .puertas .enc p{font-size:15.5px;max-width:42ch}
  .ejes{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:12px;margin-bottom:20px}
  .eje{width:100%;height:100%;text-align:left;border:1px solid var(--linea-2);background:var(--papel);color:var(--tinta);padding:18px 18px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .eje .mk{font-size:12px;color:var(--tinta-2);font-family:var(--serif)}
  .eje .nm{font-size:20px;font-family:var(--serif)}
  .eje .ds{font-size:13.5px;line-height:1.4;color:var(--tinta-2)}
  .eje[aria-pressed="true"]{border-color:var(--tinta);background:var(--tinta);color:var(--papel)}
  .eje[aria-pressed="true"] .mk{color:var(--amarillo)}
  .eje[aria-pressed="true"] .ds{color:var(--linea)}
  .panel{border:1px solid var(--tinta);padding:clamp(16px,2.6vw,26px);display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:16px}
  .panel:empty{display:none}
  .op{border:1px solid var(--linea);background:var(--papel);padding:18px 18px 14px;display:flex;flex-direction:column;gap:9px}
  .op.aviso{border-color:var(--rojo)}
  .op .tg{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta-2)}
  .op h3{font-family:var(--serif);font-size:21px;line-height:1.2}
  .op .d{margin:0;font-size:15.5px;line-height:1.55;color:var(--tinta-2);flex:1}
  .op .a{align-self:flex-start;font-size:15px;color:var(--tinta);text-decoration-color:var(--amarillo);text-decoration-thickness:2px}
  .op .marcas{margin:12px 0 0;font-size:13.5px;line-height:1.9;color:var(--tinta-2);width:100%}
  .op .marcas a{color:var(--tinta);text-decoration:underline;text-underline-offset:3px}
  .op .marcas a:hover{background:var(--papel-2)}
  .op .f{font-size:12.5px;color:var(--tinta-2);padding-top:9px;border-top:1px solid var(--linea);width:100%}

  /* afectados */
  .afectado{background:var(--verde-fondo);border-bottom:1px solid var(--verde-linea)}
  .afectado .wrap{padding-top:50px;padding-bottom:54px}
  .afectado .enc{gap:14px 40px;align-items:flex-end;margin-bottom:26px}
  .afectado .enc h2{font-size:clamp(27px,3.6vw,42px);line-height:1.1;color:var(--verde-hondo);max-width:17ch}
  .afectado .enc p{color:var(--verde);font-size:15.5px;max-width:42ch}
  .recursos{display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:16px}
  .re{border:1px solid var(--verde-linea);background:var(--verde-tarjeta);padding:19px 18px 15px;display:flex;flex-direction:column;gap:9px}
  .re h3{font-family:var(--serif);font-size:20px;line-height:1.22;color:var(--verde-hondo)}
  .re p{margin:0;font-size:15px;line-height:1.55;color:var(--verde-texto);flex:1}
  .re a{align-self:flex-start;font-size:15px;color:var(--verde-hondo);text-decoration-color:var(--verde)}
  .re .f{font-size:12.5px;color:#3B5B4C;padding-top:9px;border-top:1px solid #D7E7DE;width:100%}

  /* brecha */
  .brecha .wrap{padding:50px 24px}
  .brecha h2{font-family:var(--serif);font-size:clamp(28px,4.2vw,46px);line-height:1.08;max-width:18ch;margin-bottom:10px}
  .brecha .sub{margin:0 0 34px;color:var(--tinta-2);font-size:15.5px;max-width:56ch}
  .medidor{display:flex;flex-wrap:wrap;gap:clamp(26px,5vw,60px)}
  .medidor .izq{flex:1 1 300px}
  .barra-med{display:flex;height:14px;border:1px solid var(--linea-2)}
  .barra-med i{display:block}
  .barra-med i:nth-child(1){width:5%;background:var(--amarillo)}
  .barra-med i:nth-child(2){width:95%;background:var(--papel)}
  .leyenda{display:flex;flex-direction:column;gap:8px;margin-top:12px;font-size:13.5px;color:var(--tinta-2);line-height:1.5}
  .leyenda span{max-width:52ch}
  .leyenda span:nth-child(1){border-left:3px solid var(--amarillo);padding-left:10px}
  .leyenda span:nth-child(2){border-left:3px solid var(--linea-2);padding-left:10px}
  .medidor .expl{flex:1.3 1 340px;margin:0;font-size:17.5px;line-height:1.62}

  /* conciertos */
  .conciertos .wrap{padding:50px 24px}
  .cc{display:grid;grid-template-columns:repeat(auto-fill,minmax(298px,1fr));gap:16px}
  .co{position:relative;border:1px solid var(--linea);background:var(--tarjeta);padding:22px 20px 16px;display:flex;flex-direction:column;gap:8px}
  .co .fch{font-size:13.5px;color:var(--rojo);letter-spacing:.03em}
  .co h3{font-family:var(--serif);font-size:24px;line-height:1.16}
  .co .lug{font-size:14.5px;color:var(--tinta-2)}
  .co .art{margin:0;font-size:14.8px;line-height:1.5;color:var(--tinta-2);flex:1}
  .co .ya{font-size:12.5px;color:var(--tinta-2);border:1px solid var(--linea-2);padding:2px 8px;align-self:flex-start;white-space:nowrap}
  .co .fin{padding-top:9px;border-top:1px solid var(--linea);display:flex;flex-direction:column;gap:3px}
  .co .fin .dst{font-size:14.5px}
  .co .fin .prc{font-size:13.5px;color:var(--tinta-2)}
  .co.pasado{opacity:.55}

  /* transparencia */
  .transp{background:var(--papel-2);border-bottom:0}
  .transp .wrap{padding-top:52px;padding-bottom:56px}
  .destacadas{display:flex;flex-wrap:wrap;gap:clamp(26px,5vw,60px);margin-bottom:38px}
  .destacadas article{flex:1 1 320px;max-width:56ch}
  .destacadas h3{font-family:var(--serif);font-size:24px;line-height:1.2;color:var(--amarillo-hondo);margin-bottom:12px}
  .destacadas p{margin:0;font-size:16.5px;line-height:1.66;color:#3A4560}
  .resto{border-top:1px solid var(--linea-2);max-width:80ch}
  .resto details{border-bottom:1px solid var(--linea)}
  .resto summary{cursor:pointer;padding:15px 0;font-size:16px;list-style:none}
  .resto summary::-webkit-details-marker{display:none}
  .resto summary::before{content:"+ ";color:var(--amarillo-hondo)}
  .resto details[open] summary::before{content:"− "}
  .resto p{margin:0 0 16px;font-size:15.5px;line-height:1.62;color:var(--tinta-2)}

  /* pie */
  .pie-sitio{background:var(--tinta);color:var(--papel-2)}
  .pie-sitio .wrap{padding:46px 24px 62px;display:flex;flex-wrap:wrap;gap:clamp(26px,4vw,58px);align-items:flex-start}
  .pie-sitio .col1{flex:1.4 1 320px;display:flex;flex-direction:column;gap:16px}
  .pie-sitio .rayita{height:4px;width:104px;background:linear-gradient(90deg,var(--amarillo) 0 50%,var(--azul) 50% 75%,var(--rojo) 75% 100%)}
  .pie-sitio p{margin:0;font-size:14.8px;line-height:1.62;color:#D8DBE4}
  .pie-sitio a{color:var(--amarillo-claro);text-decoration-color:var(--amarillo-hondo)}
  .pie-sitio a:hover{color:var(--amarillo);text-decoration-color:var(--amarillo)}
  .pie-sitio .col2{flex:1 1 260px}
  .pie-sitio h3{font-family:var(--serif);font-size:17px;color:var(--amarillo-claro);margin-bottom:10px}
  .pie-sitio .fuentes{font-size:14px;line-height:1.9;color:#D8DBE4}

  .pie-sitio .col1,.pie-sitio .col2{min-width:0}
  .pie-sitio .fuentes{overflow-wrap:anywhere}
  .pie-sitio .fuentes a,.pie-sitio .fuentes span{display:block;padding:2px 0}

  @media(max-width:640px){
    /* dedos, no punteros: los blancos de toque suben a 40px sin cambiar el
       tamano visible de la letra */
    .sw button{padding:9px 4px;font-size:13px}
    .sw{gap:6px}
    .sw.loc{order:3}
    .cta{order:4;font-size:13.5px;margin-left:auto}
    .filtros{gap:14px}
    .filtros button{padding:6px 0 8px}
    .barra .wrap{gap:10px 14px}
    .cta{padding:10px 16px}
    .masthead h1 span:nth-child(2){margin-left:5%}
    .masthead h1 span:nth-child(3){margin-left:10%}
    .mapa{width:70%;opacity:.28;top:auto;bottom:-4%}
    .cita{padding-left:16px}
  }
</style>
</head>

  var OPC = {"dinero": {"t": "Dinero · lo que llega primero", "t_en": "Money · the part that arrives first", "o": [{"n": "Adopta un Hogar", "n_en": "Adopta un Hogar", "d": "Reconstrucción de vivienda en Chocó, Valle y Eje Cafetero. La Fundación Grupo Argos y Nicky Jam duplican cada peso que pongas, hasta $26.000 millones.", "d_en": "Rebuilding homes in Chocó, Valle del Cauca and the Coffee Region. Grupo Argos Foundation and Nicky Jam match every peso, up to about US$8.3 million (COP $26 billion).", "tag": "mundo", "url": "https://www.adoptaunhogar.com/", "a": "Ir a donar →", "a_en": "Go to donate →", "f": "Grupo Argos, comunicado del 13 de agosto, y sitio oficial"}, {"n": "Cruz Roja Colombiana", "n_en": "Colombian Red Cross", "d": "Salud de emergencia, agua, rescate y reunificación familiar. Campaña #TodosPorColombia, desde $10.000.", "d_en": "Emergency healthcare, water, rescue and family reunification. #TodosPorColombia campaign, from about US$3 (COP $10,000).", "tag": "mundo", "url": "https://ayuda.cruzrojacolombiana.org/emergencia-colombia-terremoto", "a": "Ir a donar →", "a_en": "Go to donate →", "f": "El Colombiano + sitio oficial"}, {"n": "Fundación PLAN", "n_en": "Fundación PLAN", "d": "Alojamiento temporal, agua segura, protección infantil y transferencias monetarias en Chocó. Tiene portal aparte para donantes fuera de Colombia.", "d_en": "Temporary shelter, safe water, child protection and cash transfers in Chocó. Separate portal for donors outside Colombia.", "tag": "mundo", "url": "https://plan.org.co/quiero-ayudar/terremoto-en-colombia/", "a": "Ir a donar →", "a_en": "Go to donate →", "f": "Cablenoticias + sitio oficial"}, {"n": "Una Garra por Colombia", "n_en": "Una Garra por Colombia", "d": "32 refugios de animales colapsados o en riesgo y unos 1.870 perros y gatos. Teja, cemento, malla, alimento y medicinas.", "d_en": "32 animal shelters collapsed or at risk and around 1,870 dogs and cats. Roofing, cement, mesh, food and medicine.", "tag": "mundo", "url": "https://vaki.co/vaki/una-garra-por-colombia", "a": "Ir a la vaki →", "a_en": "Go to the fundraiser →", "f": "Noticias RCN + Infobae"}, {"n": "ABACO · Bancos de Alimentos", "n_en": "ABACO · Food Banks", "d": "Red nacional de bancos de alimentos. Acepta transferencia internacional a Bancolombia con NIT 900326456-1.", "d_en": "National food bank network. Accepts international wires to Bancolombia, tax ID 900326456-1.", "tag": "mundo", "url": "https://donahoy.abaco.org.co/colombia2026", "a": "Ir a donar →", "a_en": "Go to donate →", "f": "Cablenoticias + El Colombiano"}, {"n": "Gobernación del Chocó", "n_en": "Chocó regional government", "d": "Cuenta oficial del departamento donde estuvo el epicentro. Banco de Bogotá, ahorros 578818429, NIT 891.680.010-3. No hay página de donación: se transfiere a esa cuenta.", "d_en": "Official account of the department where the epicentre was. Banco de Bogotá savings 578818429, tax ID 891.680.010-3. There is no donation page: you transfer to that account.", "tag": "col", "url": "https://www.elcolombiano.com/colombia/donde-donar-choco-centros-acopio-cuentas-oficiales-terremoto-colombia-KB39837058", "a": "Leer la nota con los datos →", "a_en": "Read the article with the details →", "f": "El Colombiano · los datos de la cuenta están en la nota"}, {"n": "ProPacífico · Colombia Unida", "n_en": "ProPacífico · Colombia Unida", "d": "Administra los fondos de la alianza del sector privado con la Alcaldía de Cali y la Gobernación del Valle. No tienen página propia de donación: se transfiere a la cuenta corriente del Banco de Occidente 001-5157-58, a nombre de la Fundación para el Desarrollo Integral del Pacífico, NIT 890.304.900. Llave Bre-B 0092882326. Aceptan pagos nacionales e internacionales por PSE y tarjeta.", "d_en": "Manages the funds of the private sector alliance with the Cali and Valle governments. They have no donation page of their own: you transfer to Banco de Occidente current account 001-5157-58, in the name of Fundación para el Desarrollo Integral del Pacífico, tax ID 890.304.900. Bre-B key 0092882326. They accept national and international payments by PSE and card.", "tag": "mundo", "url": "https://somoscolombiaunida.co", "a": "Ir a la campaña →", "a_en": "Go to the campaign →", "f": "somoscolombiaunida.co, sitio de la campaña, revisado el 16 de agosto de 2026"}, {"n": "Presentes · Colombia se Levanta", "n_en": "Presentes · Colombia se Levanta", "d": "Corporación de Medellín, antes Antioquia Presente, con 40 años reconstruyendo después de emergencias. Su campaña por el sismo se llama Colombia se Levanta. Recibe donación única, aportes por WhatsApp y bonos de Puntos Colombia. Quien esté en Estados Unidos y necesite certificado de donación allá puede aportar por Give to Colombia.", "d_en": "A Medellín corporation, formerly Antioquia Presente, with 40 years of rebuilding after emergencies. Its earthquake campaign is called Colombia se Levanta. It takes one-off donations, contributions by WhatsApp and Puntos Colombia vouchers. Donors in the United States who need a US tax receipt can give through Give to Colombia.", "tag": "mundo", "url": "https://presentes.co/dona/", "a": "Ir a donar →", "a_en": "Go to donate →", "f": "presentes.co, página de donación, revisada el 16 de agosto de 2026"}, {"n": "Banco de Alimentos de Bogotá", "n_en": "Bogotá Food Bank", "d": "Activó campaña de emergencia por el sismo. Recibe y distribuye alimentos y bienes; lleva 25 años haciéndolo y publica sus informes de gestión. Tiene donación única y recurrente en línea.", "d_en": "Activated an emergency campaign for the earthquake. It receives and distributes food and goods, has been doing it for 25 years and publishes its annual reports. One-off and recurring donations online.", "tag": "mundo", "url": "https://www.bancodealimentos.org.co/donaciones-hoy-min/", "a": "Ir a donar →", "a_en": "Go to donate →", "f": "bancodealimentos.org.co, revisada el 16 de agosto de 2026"}, {"n": "All Hands and Hearts", "n_en": "All Hands and Hearts", "d": "ONG de respuesta a desastres, en terreno desde el día del sismo. Reparte carpas, lonas, colchones, mantas y almohadas, y kits de higiene, y entregó cascos, guantes y tapabocas a los equipos de rescate. Trabaja en Pereira, Cali, Dagua, La Cumbre, Restrepo, Vijes, La Unión y Calima-Darién. El cobro es en dólares y aceptan giro internacional.", "d_en": "Disaster response NGO, on the ground since the day of the quake. Distributing tents and tarps, mattresses, blankets and pillows, and hygiene kits, and gave helmets, gloves and masks to rescue teams. Working in Pereira, Cali, Dagua, La Cumbre, Restrepo, Vijes, La Unión and Calima-Darién. Checkout is in US dollars and they accept international wires.", "tag": "mundo", "url": "https://give.allhandsandhearts.org/campaign/783951/donate", "a": "Ir a donar →", "a_en": "Go to donate →", "f": "allhandsandhearts.org, programa Colombia y boletín del 15 de agosto, revisados el 16 de agosto de 2026"}, {"n": "TECHO", "n_en": "TECHO", "d": "Campaña regional de TECHO por esta emergencia, en cuatro fases que terminan en construcción de viviendas de emergencia. Su página dice que el aporte se asigna de forma flexible entre albergue, asistencia de emergencia y reconstrucción. Dona por su página, que es el canal que ellos publican.", "d_en": "TECHO's regional campaign for this emergency, in four phases ending in emergency housing. Their page says contributions are allocated flexibly across shelter, emergency assistance and rebuilding. Give through their page, which is the channel they publish.", "tag": "mundo", "url": "https://techo.org/emergencia-colombia/", "a": "Ir a la campaña →", "a_en": "Go to the campaign →", "f": "techo.org/emergencia-colombia, revisada el 16 de agosto de 2026 · la cuenta del flyer no se pudo confirmar"}, {"n": "Global Empowerment Mission", "n_en": "Global Empowerment Mission", "d": "ONG estadounidense especializada en logística de desastres, con misión abierta por este terremoto. Su primer vuelo de carga llegó con Avianca Cargo y montaron tres centros logísticos en Medellín, Pereira y Cali con equipos colombianos, junto a Solidaridad por Colombia. Su propia bitácora reporta 188 pallets y 77,94 toneladas enviadas, con 9.685 kits familiares, 2.500 kits de alimentos comprados en Colombia, 24 generadores, agua e insumos médicos. El cobro es en dólares y el certificado de donación solo sirve ante el fisco de Estados Unidos.", "d_en": "A US disaster-logistics NGO with an open mission for this earthquake. Their first cargo flight arrived with Avianca Cargo and they set up three logistics hubs in Medellín, Pereira and Cali with Colombian teams, alongside Solidaridad por Colombia. Their own log reports 188 pallets and 77.94 tonnes shipped, including 9,685 family kits, 2,500 food kits bought in Colombia, 24 generators, water and medical supplies. Checkout is in US dollars and the tax receipt only applies in the United States.", "tag": "mundo", "url": "https://www.globalempowermentmission.org/mission/colombia-earthquake/", "a": "Ir a la misión →", "a_en": "Go to the mission →", "f": "globalempowermentmission.org, misión Colombia Earthquake y bitácora, revisadas el 16 de agosto de 2026"}, {"n": "Fundación Arturo Calle", "n_en": "Fundación Arturo Calle", "d": "La Fundación y el Grupo Empresarial Arturo Calle duplican cada peso que done el público, con meta de $2.000 millones. Va aparte del aporte de US$500.000 que la familia anunció para reconstrucción. Los datos para donar están en su cuenta.", "d_en": "The foundation and the Arturo Calle business group match every peso the public gives, with a target of COP $2 billion. This is separate from the US$500,000 the family announced for rebuilding. The payment details are on their account.", "tag": "col", "url": "https://www.instagram.com/fundacionarturocalle/", "a": "Ver la campaña →", "a_en": "See the campaign →", "f": "Canales propios de la Fundación, 14 y 16 de agosto · su web no se pudo abrir"}]}, "oficio": {"t": "Tu oficio · lo que sabes hacer", "t_en": "Your profession · what you know how to do", "o": [{"n": "SismoAyuda Colombia", "n_en": "SismoAyuda Colombia", "d": "Si eres ingeniero estructural, civil o arquitecto: revisas fotos de viviendas dañadas y emites evaluación técnica siguiendo ATC-20 y EMS-98. Todo remoto. Son orientaciones preliminares y no reemplazan la inspección oficial.", "d_en": "If you are a structural or civil engineer, or an architect: you review photos of damaged homes and issue a technical assessment following ATC-20 and EMS-98. Entirely remote. Preliminary guidance only; does not replace official inspection.", "tag": "mundo", "url": "https://sismoayudaco.com/inspector/registro", "a": "Registrarme como inspector →", "a_en": "Register as an inspector →", "f": "Sitio oficial de la plataforma"}, {"n": "Profesionales de la salud", "n_en": "Health professionals", "d": "Convocatoria de la Asociación Colombiana de Sociedades Científicas y Assosalud. Prioritarios: cirugía, ortopedia y traumatología, medicina intensiva, pediatría, psiquiatría y psicología. Requiere viajar.", "d_en": "Call from the Colombian Association of Scientific Societies and Assosalud. Priority areas: surgery, orthopaedics and trauma, intensive care, paediatrics, psychiatry and psychology. Requires travelling.", "tag": "col", "url": "https://acsc-gray.vercel.app/emergencia", "a": "Ir al formulario →", "a_en": "Go to the form →", "f": "El Tiempo · 11 ago"}, {"n": "Ingenieros y arquitectos en Cali", "n_en": "Engineers and architects in Cali", "d": "La Secretaría de Gestión del Riesgo convoca ingenieros civiles, estructurales y arquitectos para evaluar edificaciones. No hay formulario ni inscripción en línea: hay que presentarse en el punto, la Cruz Roja Seccional Valle, Cra. 38 Bis #5-91 en Cali, donde hay personal de la Secretaría durante el día.", "d_en": "Cali's risk management office is calling for civil and structural engineers and architects to assess buildings. There is no online form or sign-up: you show up at the meeting point, the Red Cross Valle branch at Cra. 38 Bis #5-91 in Cali, where staff are on site during the day.", "tag": "col", "url": "https://www.elpais.com.co/cali/alcaldia-de-cali-busca-voluntarios-para-apoyar-en-la-evaluacion-de-viviendas-afectadas-por-el-sismo-asi-puede-participar-1122.html", "a": "Leer la convocatoria →", "a_en": "Read the call →", "f": "El País de Cali · confirmar que siga vigente antes de ir"}, {"n": "Si tejes", "n_en": "If you knit or crochet", "d": "Desenlace Macramé recoge cuadros tejidos a crochet de 20 por 20 centímetros y los une hasta formar cobijas de 100 por 80. Sirve aunque mandes uno solo, y también reciben cobijas terminadas en cualquier técnica. Puntos de entrega en Medellín e Itagüí, y el 22 de agosto hay tejetón en Plazuelas de San Diego, donde ponen los materiales. Los detalles los mandan por mensaje directo si comentas la publicación.", "d_en": "Desenlace Macramé collects crocheted granny squares of 20 by 20 centimetres and joins them into blankets of 100 by 80. Sending a single square counts, and they also take finished blankets in any technique. Drop-off points in Medellín and Itagüí, and on 22 August there is a group knitting session at Plazuelas de San Diego, with materials provided. They send the details by direct message if you comment on the post.", "tag": "col", "url": "https://www.instagram.com/desenlace.macrame/reel/Db_xh35upi8/", "a": "Ver la convocatoria →", "a_en": "See the call →", "f": "Publicación de la propia cuenta, revisada el 16 de agosto de 2026"}]}, "tiempo": {"t": "Tu tiempo · con o sin experiencia", "t_en": "Your time · with or without experience", "o": [{"n": "Adopta un Hogar · voluntariado", "n_en": "Adopta un Hogar · volunteering", "d": "La campaña de la Fundación Grupo Argos y Nicky Jam para reconstruir viviendas en Chocó, el Eje Cafetero y el Valle del Cauca también recibe tiempo, no solo plata. El formulario pide nombre, celular, correo y en qué puedes aportar, y acepta teléfonos de cualquier país. La campaña no publica todavía fechas, tareas ni si hay algo que se pueda hacer a distancia.", "d_en": "The Grupo Argos Foundation and Nicky Jam campaign to rebuild homes in Chocó, the Coffee Region and Valle del Cauca takes time as well as money. The form asks for your name, phone, email and how you can help, and accepts phone numbers from any country. The campaign has not yet published dates, tasks, or whether anything can be done remotely.", "tag": "col", "url": "https://e1a2e8d3.sibforms.com/serve/MUIFAH_TGMaZqxCOCcB3LdLkjD0qsKyD2xHOuhAc_o3_kL94hCKrufL4WQk8F_dGm9fQ_54_pzl-qk6PHWHqQdddzhMK-HhnagC4dt-u59Yew57NQJP3QMJyPfIJAgaeeKrHvuiPA4WQJWPcCZzCaMerE2gwo4k-RX83d1OuxXm390vFpuWzSb5-KNfcHVJ-FiffoEZvm79scc2b", "a": "Ir al formulario →", "a_en": "Go to the form →", "f": "adoptaunhogar.com · el formulario que enlaza la propia campaña"}, {"n": "encontrados.co · desde el computador", "n_en": "encontrados.co · from your computer", "d": "Plataforma que reúne los reportes de personas buscadas después del sismo. Necesitan voluntarios para verificar reportes a mano y cargarlos a las demás plataformas, para que una familia no tenga que repetir la búsqueda en cinco sitios. Se hace desde cualquier parte y se postula por mensaje directo, con tu correo y tu LinkedIn.", "d_en": "A platform gathering reports of people missing after the quake. They need volunteers to verify reports by hand and load them onto the other platforms, so a family does not have to repeat the same search in five places. It is done from anywhere; you apply by direct message with your email and LinkedIn.", "tag": "mundo", "url": "https://encontrados.co", "a": "Ver la plataforma →", "a_en": "See the platform →", "f": "encontrados.co y la convocatoria de su equipo, revisadas el 16 de agosto de 2026"}, {"n": "Cruz Roja Bogotá · inmediato", "n_en": "Red Cross Bogotá · immediate", "d": "Recibir, revisar, ordenar y empacar donaciones. Puntos en Usaquén (Calle 161A #7F-55) y la sede de la Carrera 24 #73-38, que opera 24 horas.", "d_en": "Receiving, checking, sorting and packing donations. Points at Usaquén (Calle 161A #7F-55) and the headquarters at Carrera 24 #73-38, open 24 hours.", "tag": "col", "url": "https://voluntariado.cruzrojabogota.org.co/ciudadanos", "a": "Inscribirme →", "a_en": "Sign up →", "f": "Alcaldía de Bogotá"}, {"n": "terremotocolombia.co", "n_en": "terremotocolombia.co", "d": "Plataforma ciudadana de código abierto. Formulario corto: nombre, teléfono, qué puedes ofrecer y en qué zona estás. Los coordinadores contactan después.", "d_en": "Citizen-run, open source. Short form: name, phone, what you can offer and where you are. Coordinators follow up.", "tag": "col", "url": "https://terremotocolombia.co/voluntario", "a": "Ir al formulario →", "a_en": "Go to the form →", "f": "Noticias RCN"}, {"n": "El Minuto de Dios", "n_en": "El Minuto de Dios", "d": "Formulario donde indicas tu disponibilidad por días y horas. No exige formación previa y ubican rápido.", "d_en": "A form where you give your availability by day and hour. No prior training required and they place people quickly.", "tag": "col", "url": "https://www.uniminuto.edu/ced-bogota-voluntariado", "a": "Ir al formulario →", "a_en": "Go to the form →", "f": "Noticias RCN"}, {"n": "Cruz Roja Ciclo IV · léelo antes", "n_en": "Red Cross Cycle IV · read this first", "d": "El voluntariado formal de la Cruz Roja en Bogotá es otra cosa: cuesta $148.000 de inscripción más $345.000 del curso, y toma cuatro meses. No es ayuda de emergencia, es voluntariado de largo plazo. Lo incluimos para que nadie se lleve una sorpresa.", "d_en": "The Red Cross formal volunteer programme in Bogotá is a different thing: about US$47 to register plus about US$110 for the course, over four months. It is not emergency help, it is long-term volunteering. We list it so no one is caught out.", "tag": "col", "aviso": true, "a": "Solo si buscas compromiso largo", "a_en": "Only if you want a long commitment", "f": "Portafolio"}]}, "cosas": {"t": "Cosas · pero las correctas", "t_en": "Things · but the right ones", "o": [{"n": "Colombia se Levanta · dónde llevar lo que tienes", "n_en": "Colombia se Levanta · where to take what you have", "d": "Mapa con 150 centros de acopio, 19 albergues y 13 puntos de salud, cada punto con lo que pide hoy y lo que ya no necesita. También tiene tablero de necesidades, arriendos, empleo y búsqueda de personas y animales. Cada punto cita de dónde salió. No dice quién lo opera, así que lo enlazamos como herramienta útil, no como aval.", "d_en": "A map with 150 collection points, 19 shelters and 13 health posts, each one listing what it needs today and what it no longer needs. It also has a needs board, housing, jobs and searches for missing people and pets. Every point cites where it came from. It does not say who runs it, so we link it as a useful tool, not as an endorsement.", "tag": "col", "url": "https://colombiaselevanta.co/", "a": "Ver el mapa →", "a_en": "Open the map →", "f": "Revisado en el navegador el 16 de agosto de 2026"}, {"n": "Quiero Ayudar · qué se necesita ahora mismo", "n_en": "Quiero Ayudar · what is needed right now", "d": "Entras sin registro y eliges tu papel: estoy en zona afectada, atiendo un acopio, puedo poner logística o quiero donar. Muestra las urgencias abiertas y qué falta en cada punto. No recauda dinero. No dice quién lo opera, así que lo enlazamos como herramienta útil, no como aval.", "d_en": "No sign-up. You pick your role: I am in an affected area, I run a collection point, I can move things, or I want to give. It shows open urgent needs and what is missing at each point. It takes no money. It does not say who runs it, so we link it as a useful tool, not as an endorsement.", "tag": "col", "url": "https://quieroayudar.co/", "a": "Ver qué falta →", "a_en": "See what is missing →", "f": "Revisado en el navegador el 16 de agosto de 2026"}, {"n": "Dónde Puedo Ayudar · directorio por categoría", "n_en": "Dónde Puedo Ayudar · directory by category", "d": "Directorio ciudadano hecho por LuupLab. Reúne 16 sitios y 9 organizaciones verificadas, ordenados por categoría (dinero, alimentos y kits, refugio, salud, voluntariado, mascotas, reconstrucción e información) y por zona: Valle, Risaralda, Quindío, Caldas, Chocó, Buenaventura y zonas rurales. No recibe ni intermedia dinero, y sí dice quién lo opera.", "d_en": "A citizen-built directory by LuupLab. It gathers 16 sites and 9 verified organisations, sorted by category (money, food and kits, shelter, health, volunteering, pets, rebuilding and information) and by area: Valle, Risaralda, Quindío, Caldas, Chocó, Buenaventura and rural zones. It takes no money and it does say who runs it.", "tag": "mundo", "url": "https://dondepuedoayudar.com/", "a": "Ver el directorio →", "a_en": "Open the directory →", "f": "Revisado el 16 de agosto de 2026"}, {"n": "Ayudas Pereira · 161 centros y qué falta en cada uno", "n_en": "Ayudas Pereira · 161 centres and what each one needs", "d": "Empezó por Pereira y hoy cubre 42 municipios de Risaralda, Valle, Antioquia, Caldas, Quindío, Chocó y Bogotá. Cada centro dice qué necesita con urgencia y qué ya le sobra, y marca los casos que ya fueron atendidos para no duplicar viajes. Hoy Pereira tiene 76 centros con 77 urgencias abiertas, Dosquebradas 18 y Bogotá 33. Lo hizo el estudio Orgánico. El dominio redirige a alluda.online, que es el mismo proyecto.", "d_en": "It started with Pereira and now covers 42 municipalities across Risaralda, Valle, Antioquia, Caldas, Quindío, Chocó and Bogotá. Each centre states what it urgently needs and what it already has too much of, and flags cases already handled so trips are not duplicated. Today Pereira has 76 centres with 77 open urgent needs, Dosquebradas 18 and Bogotá 33. Built by Orgánico studio. The domain redirects to alluda.online, which is the same project.", "tag": "col", "url": "https://ayudaspereira.com", "a": "Ver los centros →", "a_en": "See the centres →", "f": "ayudaspereira.com, revisado en el navegador el 16 de agosto de 2026"}, {"n": "Mapa vivo de acopio en Bogotá", "n_en": "Bogotá's live collection map", "d": "La Alcaldía mantiene un mapa interactivo con los puntos habilitados, horarios y qué necesita cada uno. Se actualiza a diario. Úsalo antes que cualquier lista fija, incluida esta.", "d_en": "The city keeps an interactive map of open collection points, hours and what each one needs. Updated daily. Use it before any fixed list, including this one.", "tag": "col", "url": "https://mapas.bogota.gov.co/", "a": "Abrir el mapa · capa 127089 →", "a_en": "Open the map · layer 127089 →", "f": "Alcaldía de Bogotá"}, {"n": "ProPacífico recoge donde estés", "n_en": "ProPacífico will collect from you", "d": "Piden sobre todo medicamentos e insumos médicos para Chocó, Tuluá y Quibdó. Bodega en Carrera 4 # 22-07, barrio San Nicolás, Cali. Si los llamas recogen la donación donde estés: 324 566 6775 (Steven González) o 312 833 8340 (Lorena Tabares).", "d_en": "They mainly need medicines and medical supplies for Chocó, Tuluá and Quibdó. Warehouse at Carrera 4 # 22-07, San Nicolás, Cali. Call and they will collect from wherever you are: +57 324 566 6775 (Steven González) or +57 312 833 8340 (Lorena Tabares).", "tag": "col", "url": "https://www.elpais.com.co/cali/propacifico-activa-campana-de-solidaridad-para-atender-a-damnificados-por-el-terremoto-1129.html", "a": "Leer la nota →", "a_en": "Read the article →", "f": "El País de Cali"}, {"n": "Qué sí sirve y qué no", "n_en": "What helps and what does not", "d": "Agua sellada, cobijas, enlatados de fácil apertura, pañales, gasas. Nada de perecederos, medicamentos empezados ni ropa usada en mal estado. Lo que no sirve ocupa bodega y transporte que hacen falta.", "d_en": "Sealed water, blankets, easy-open tinned food, nappies, gauze. No perishables, no opened medication, no worn-out clothing. What does not help takes up storage and transport that is needed.", "tag": "col", "url": "https://www.infobae.com/colombia/2026/08/14/cruz-roja-aclaro-que-donaciones-necesitan-las-victimas-del-terremoto-y-que-no-kits-de-habitat/", "a": "Leer la nota de la Cruz Roja →", "a_en": "Read the Red Cross article →", "f": "Cruz Roja Colombiana vía Infobae"}, {"n": "Acopio para animales · Corferias", "n_en": "Animal donations · Corferias", "d": "Alimento seco y húmedo, arena, guacales, collares, correas, gasas y antisépticos. Carrera 37 # 24-67, del 13 al 17 de agosto, de 10 a.m. a 6 p.m. Organiza el Idypba.", "d_en": "Dry and wet food, litter, carriers, collars, leads, gauze and antiseptics. Carrera 37 # 24-67, August 13 to 17, 10 a.m. to 6 p.m. Run by Bogotá's animal welfare institute.", "tag": "col", "url": "https://www.infobae.com/colombia/2026/08/13/corferias-habilito-centro-de-acopio-para-ayudar-a-mascotas-damnificadas-por-el-sismo-asi-puede-donar-desde-bogota/", "a": "Leer la nota con horarios →", "a_en": "Read the article with the hours →", "f": "Infobae"}, {"n": "Cali Solidaria · dos puntos", "n_en": "Cali Solidaria · two points", "d": "La Alcaldía de Cali habilitó recolección en la Plazoleta Jairo Varela (Av. 2 Nte. #10 Norte-1) y en la Escuela Nacional del Deporte (Calle 9 #34-01). Al 14 de agosto pedían guantes de construcción, gafas de seguridad, cascos, agua, colchonetas, alimentos no perecederos, kits de aseo y cobijas. El horario que circula en redes no lo pudimos confirmar en ninguna fuente: llama o revisa antes de ir.", "d_en": "Cali's city government opened collection at Plazoleta Jairo Varela (Av. 2 Nte. #10 Norte-1) and the Escuela Nacional del Deporte (Calle 9 #34-01). As of 14 August they were asking for construction gloves, safety goggles, helmets, water, sleeping mats, non-perishable food, hygiene kits and blankets. The opening hours going round on social media could not be confirmed in any source: check before going.", "tag": "col", "url": "https://www.elpais.com.co/cali/alcaldia-habilita-nuevos-espacios-para-recibir-ayudas-y-atender-a-afectados-en-cali-1154.html", "a": "Leer la nota →", "a_en": "Read the article →", "f": "El País de Cali y Diario Occidente · lista actualizada al 14 de agosto"}, {"n": "Tres puntos en Bogotá para el Chocó", "n_en": "Three points in Bogotá for Chocó", "d": "Casa Jardín Origen (Calle 38 #29-29, Teusaquillo), Human Construction (Carrera 52A #134D-23 local 1) y Fundación Catalina Muñoz (Diagonal 48 #19-16), de 8 a.m. a 6 p.m. Reciben cosas, no dinero.", "d_en": "Casa Jardín Origen (Calle 38 #29-29, Teusaquillo), Human Construction (Carrera 52A #134D-23 local 1) and Fundación Catalina Muñoz (Diagonal 48 #19-16), 8 a.m. to 6 p.m. They take goods, not money.", "tag": "col", "url": "https://revistadiners.com.co/lo-ultimo/puntos-de-acopio-terremoto-colombia/", "a": "Ver la lista →", "a_en": "See the list →", "f": "Revista Diners · la cuenta del flyer no se pudo confirmar"}, {"n": "Centro Deportivo Luz Mery Tristán · Cali", "n_en": "Luz Mery Tristán Sports Centre · Cali", "d": "Recibe donaciones en la Calle 18 #180-00, en Cali. Piden agua, vendas, guantes de carnaza, seguetas, alcohol y mantas, que es lo que necesitan las brigadas que están removiendo escombros.", "d_en": "Taking donations at Calle 18 #180-00 in Cali. They are asking for water, bandages, leather gloves, hacksaws, alcohol and blankets, which is what the crews clearing rubble need.", "tag": "col", "url": "https://www.instagram.com/lmt_centrodeportivo/", "a": "Ver la convocatoria →", "a_en": "See the call →", "f": "Publicación del propio centro deportivo, revisada el 16 de agosto de 2026"}, {"n": "Fonda The Ranch · entre Armenia y Pereira", "n_en": "Fonda The Ranch · between Armenia and Pereira", "d": "Una fonda del kilómetro 5 de la vía Armenia a Pereira se volvió centro de acopio y distribución para Risaralda, Quindío y Valle del Cauca, trabajando con brigadas de rescate, voluntarios y gestión del riesgo. No publican horario: escríbeles antes de ir.", "d_en": "A roadhouse at km 5 of the Armenia to Pereira road turned into a collection and distribution hub for Risaralda, Quindío and Valle del Cauca, working with rescue crews, volunteers and the risk management office. They do not publish opening hours: message them before going.", "tag": "col", "url": "https://www.instagram.com/p/DcE14XSyBEY/", "a": "Ver la publicación →", "a_en": "See the post →", "f": "Publicación de los organizadores, revisada el 16 de agosto de 2026"}]}, "voz": {"t": "Tu voz · difundir lo cierto", "t_en": "Your voice · spreading what is true", "o": [{"n": "Comparte esta página", "n_en": "Share this page", "d": "Cada organización aquí está verificada contra su fuente. Mandarla es darle a alguien una lista en la que puede confiar, en vez de una cadena de WhatsApp sin origen.", "d_en": "Every organisation here is checked against its source. Sending it means giving someone a list they can trust, instead of an unsourced chain message.", "tag": "mundo", "siempre": true, "a": "Copiar el enlace →", "a_en": "Copy the link →", "f": "403 hechos · 254 fuentes", "copiar": true}, {"n": "Frena lo falso", "n_en": "Stop what is false", "d": "Ya circula video de otro país presentado como si fuera este terremoto: lo encontramos en el propio hashtag, con comentaristas señalando que era de Chile. Antes de compartir, mira si la cuenta es de quien hizo la cosa. Si no puedes decir quién grabó y cuándo, no lo mandes.", "d_en": "Footage from another country is already circulating as if it were this earthquake: we found it in the hashtag itself, with commenters pointing out it was from Chile. Before sharing, check whether the account belongs to whoever did the thing. If you cannot say who filmed it and when, do not send it.", "tag": "mundo", "siempre": true, "a": "Verificado por nosotros el 15 de agosto", "a_en": "Checked by us on August 15", "f": "Hallazgo propio, documentado en transparencia"}, {"n": "Mándanos lo que viste", "n_en": "Send us what you saw", "d": "Si viste a alguien ayudando y quieres que aparezca aquí, mándanos el enlace. Lo verificamos y entra con crédito a quien lo publicó. Recibir no implica publicar.", "d_en": "If you saw someone helping and you want them here, send us the link. We verify it and it goes up with credit to whoever posted it. Receiving does not mean publishing.", "tag": "mundo", "siempre": true, "a": "Escríbenos →", "a_en": "Write to us →", "f": "Todo se verifica antes de publicar"}]}, "comprando": {"t": "Comprando · negocios que ponen algo de su parte", "t_en": "Through shops · businesses that put in their share", "o": [{"n": "D1 · kits de donación", "n_en": "D1 · donation kits", "d": "Compras un kit de aseo o de alimentos en cualquier tienda D1 o en su página, y no te lo llevas: la empresa lo transporta desde su centro de distribución hasta los bancos de alimentos. Por cada kit que compra un cliente, D1 dona otro. Hoy hay cuatro kits en la tienda en línea, entre $14.650 y $29.730. La prensa los reportó como $15.000 y $30.000; estos son los precios que aparecen hoy en la página de la empresa.", "d_en": "You buy a hygiene or food kit at any D1 store or on their website, and you do not take it home: the company ships it from its distribution centre to the food banks. For every kit a customer buys, D1 donates another. There are four kits in the online shop today, between about US$4.70 and US$9.50 (COP $14,650 and $29,730). The press reported them as COP $15,000 and $30,000; these are the prices showing on the company's page today.", "tag": "mundo", "url": "https://www.d1.com.co/donaciones", "a": "Ver los kits →", "a_en": "See the kits →", "f": "Tiendas D1, página de donaciones, revisada el 16 de agosto de 2026, más Portafolio y El País de Cali"}, {"n": "Only Home · una colchoneta por compra", "n_en": "Only Home · a mattress per purchase", "d": "Empresa quindiana de mobiliario. Por cada compra de muebles en cualquiera de sus 17 tiendas o en su página donan una colchoneta a una familia afectada, sin costo adicional para ti y sin cupón ni registro. La meta son 1.000 y publican el avance cada semana. No aplica a decoración, textiles, iluminación ni ropa de cama. Sus tiendas además reciben donaciones aunque no compres nada, y no reciben dinero.", "d_en": "A furniture company from Quindío. For every furniture purchase in any of its 17 stores or on its website they donate a sleeping mat to an affected family, at no extra cost to you and with no coupon or sign-up. The target is 1,000 and they publish progress weekly. It does not apply to decor, textiles, lighting or bedding. Their stores also accept donations whether you buy or not, and they take no money.", "tag": "col", "url": "https://onlyhome.co/pages/programa-de-donaciones", "a": "Ver los términos →", "a_en": "See the terms →", "f": "onlyhome.co, términos de la campaña, revisados el 16 de agosto de 2026"}, {"n": "Happy Sleep · Unidos por Colombia", "n_en": "Happy Sleep · Unidos por Colombia", "d": "Fábrica de colchones de Armenia. Compras una colchoneta de 100 por 190 con almohada por $134.200 y ellos la entregan en Expofuturo, en Pereira, que es el principal centro de acopio de la ciudad y ya ha movido más de 120 toneladas. Tú no recibes nada: el pedido va directo a una familia. Se pide por teléfono, al 311 635 6495 o al 313 7183127.", "d_en": "A mattress factory in Armenia. You buy a 100 by 190 sleeping mat with a pillow for about US$43 (COP $134,200) and they deliver it to Expofuturo in Pereira, the city's main collection centre, which has already handled over 120 tonnes. You receive nothing: the order goes straight to a family. Orders by phone, on +57 311 635 6495 or +57 313 718 3127.", "tag": "col", "url": "https://www.happysleep.com.co/", "a": "Ver la empresa →", "a_en": "See the company →", "f": "Pieza de la propia empresa, con el teléfono que coincide con el de su página oficial · Expofuturo según El Espectador"}, {"n": "El Mono Bandido · la camiseta la pone la marca", "n_en": "El Mono Bandido · the brand covers the shirt", "d": "Donas $80.000 en la página de la Cruz Roja Colombiana, eligiendo la opción de una sola vez, y dejas tus datos. La marca te contacta para la talla y te manda la camiseta. Lo que vale la pena mirar de esta mecánica: el dinero no pasa por la marca en ningún momento. La página es del dominio de la Cruz Roja, con los dos logos. No dice si envían fuera de Colombia.", "d_en": "You donate COP $80,000 on the Colombian Red Cross page, choosing the one-off option, and leave your details. The brand contacts you for your size and sends the shirt. The part worth noting: the money never passes through the brand. The page sits on the Red Cross domain, carrying both logos. It does not say whether they ship outside Colombia.", "tag": "mundo", "url": "https://ayuda.cruzrojacolombiana.org/emergencia-colombia-terremoto-ELMONOBANDIDO", "a": "Ir a la página de la Cruz Roja →", "a_en": "Go to the Red Cross page →", "f": "Página de la campaña en el dominio de la Cruz Roja Colombiana, revisada el 16 de agosto de 2026"}, {"n": "Colombia Florece · nueve marcas, tres kits", "n_en": "Colombia Florece · nine brands, three kits", "d": "Nueve marcas colombianas pequeñas se juntaron. Donas a la Cruz Roja por su página oficial, que está en la puerta de Dinero, les mandas la captura por mensaje directo con tu nombre y celular, y el miércoles 19 en la tarde sortean tres kits con productos de todas. Ninguna recibe ni administra el dinero. Aquí abajo están las nueve, con su enlace: hay zapatos, joyería, vestidos de baño, tejidos y ropa, casi todo hecho en Colombia y casi todas de Medellín. Comprarles a ellas también sostiene esto, porque son negocios pequeños poniendo de su bolsillo.", "d_en": "Nine small Colombian brands teamed up. You donate to the Red Cross through their official page, in the Money door, send them the receipt by direct message with your name and phone, and on Wednesday the 19th they draw three kits with products from all of them. None of them receives or handles the money. All nine are listed below with their link: shoes, jewellery, swimwear, knitwear and clothing, nearly all made in Colombia and nearly all from Medellín. Buying from them also sustains this, because these are small businesses paying out of their own pocket.", "tag": "col", "url": "https://www.instagram.com/taloons.co/p/DcEMiGwkTRm/", "a": "Ver cómo participar →", "a_en": "See how to take part →", "f": "Publicación de las marcas participantes, revisada el 16 de agosto de 2026 · termina el miércoles 19", "marcas": [{"n": "Taloons, zapatos", "url": "https://linktr.ee/taloonsmarketplace"}, {"n": "Vida Mía, ropa", "url": "https://linktr.ee/vidamiaropa"}, {"n": "Maral Designs, ropa", "url": "https://linktr.ee/maral.designs"}, {"n": "Octavo Pecado, moda lenta", "url": "https://www.octavopecado.co"}, {"n": "Scapelia, vestidos de baño", "url": "https://linktr.ee/scapeliaswimwear"}, {"n": "Must Have, ropa", "url": "https://linktr.ee/musthave.co"}, {"n": "Súper Lindas, camisetas y tejidos", "url": "https://www.superlindas.co"}, {"n": "Maruva, joyería", "url": "https://linktr.ee/maruvajewelry"}, {"n": "By Vivi Bol, pañoletas y gorritos tejidos", "url": "https://www.instagram.com/byvivibol/"}]}, {"n": "Frijolada por Colombia · 19 y 20 de agosto", "n_en": "Frijolada por Colombia · 19 and 20 August", "d": "Dos cocineros abren su cocina de la Calle 119 #11D-29, en Bogotá, el miércoles 19 y el jueves 20, de 12 del día a 6 de la tarde. Vas, comes frijoles y lo que se recoja va a Gastronomía Social y a World Central Kitchen. La meta son $40 millones. Para saber cómo pagar, comenta COLOMBIA en su publicación.", "d_en": "Two cooks open their kitchen at Calle 119 #11D-29 in Bogotá on Wednesday the 19th and Thursday the 20th, from midday to 6 p.m. You go, you eat beans, and what is raised goes to Gastronomía Social and World Central Kitchen. The target is COP $40 million. To find out how to pay, comment COLOMBIA on their post.", "tag": "col", "url": "https://www.instagram.com/reel/Db_lrlNKWe5/", "a": "Ver los detalles →", "a_en": "See the details →", "f": "Publicación de los cocineros, revisada el 16 de agosto de 2026 · es el 19 y 20"}, {"n": "Arte por Colombia", "n_en": "Arte por Colombia", "d": "24 galerías y más de 130 artistas venden obra por catálogo digital y el 100% del valor va a Cruz Roja, Presentes, Manos Visibles y Una Garra por Colombia. Las galerías y los artistas asumen todos los costos. La venta va por un catálogo digital: el enlace al catálogo está dentro de la nota. En sus primeros días superó los $260 millones.", "d_en": "24 galleries and over 130 artists selling work through a digital catalogue; 100% of the price goes to the Red Cross, Presentes, Manos Visibles and Una Garra por Colombia. Galleries and artists cover every cost. Sales run through a digital catalogue; the link to it is inside the article. It passed about US$83,000 in its first days.", "tag": "mundo", "url": "https://www.periodicoarteria.com/arte-por-colombia-galer%C3%ADas-y-artistas-apoyo-terremoto", "a": "Leer la nota y abrir el catálogo →", "a_en": "Read the article and open the catalogue →", "f": "Periódico Arteria + El Tiempo"}, {"n": "Maglione", "n_en": "Maglione", "d": "Marca colombiana de tejidos. Dona todo el dinero de las ventas de su tienda física y su página web del 14 al 19 de agosto, repartido entre cinco fundaciones de las regiones afectadas. Es una ventana corta: verifica que siga abierta.", "d_en": "Colombian knitwear brand. Giving away all revenue from its shop and website between 14 and 19 August, split across five foundations in the affected regions. Short window: check it is still running.", "tag": "mundo", "url": "https://maglione.co/", "a": "Ir a la tienda →", "a_en": "Go to the shop →", "f": "El Espectador"}, {"n": "Libertario Coffee Roasters", "n_en": "Libertario Coffee Roasters", "d": "Tostador de café que donó una tonelada de producto, abrió acopio en Bogotá, Medellín y Cartagena, y destina el 20% de las ventas de su café Libre en bolsa durante agosto.", "d_en": "Coffee roaster that donated a tonne of product, opened collection points in Bogotá, Medellín and Cartagena, and gives 20% of sales of its bagged Libre coffee through August.", "tag": "mundo", "url": "https://www.libertariocoffee.com/", "a": "Ir a la tienda →", "a_en": "Go to the shop →", "f": "Revista Diners"}, {"n": "Zierra Leona", "n_en": "Zierra Leona", "d": "Destina el 100% de las ventas de su referencia Panthera T-shirt Ivory a los animales afectados, y su tienda en el Valle del Cauca funciona como punto de recolección.", "d_en": "Gives 100% of sales of its Panthera T-shirt Ivory to animals affected by the quake, and its Valle del Cauca shop doubles as a collection point.", "tag": "mundo", "url": "https://www.zierraleona.com/", "a": "Ir a la tienda →", "a_en": "Go to the shop →", "f": "El Espectador"}, {"n": "Soreil", "n_en": "Soreil", "d": "Destina el 20% de sus ventas de agosto a comprar ropa interior para donarla a las personas afectadas, que es de lo que menos llega porque no puede donarse usada. Escríbeles por su cuenta para comprar.", "d_en": "Gives 20% of its August sales to buying underwear to donate to affected families, one of the things that arrives least because it cannot be given second-hand. Message them on their account to buy.", "tag": "mundo", "url": "https://www.elespectador.com/moda-e-industria/empresas-textiles-y-marcas-de-moda-se-suman-para-apoyar-a-los-afectados-por-el-terremoto/", "a": "Leer la nota →", "a_en": "Read the article →", "f": "El Espectador"}, {"n": "¿Tienes un negocio? Esta puerta también es tuya", "n_en": "Do you run a business? This door is yours too", "d": "Varias de estas marcas no donaron dinero propio: destinaron un porcentaje o el total de lo que vendieron en unos días. Y hay un modelo todavía más liviano, que en esta lista ya funciona dos veces: el dinero nunca pasa por la marca. El Mono Bandido pide que dones en la página de la Cruz Roja y te manda la camiseta. Nueve marcas pequeñas juntas piden lo mismo y sortean tres kits entre quienes muestren su donación. Ninguna toca la plata, y por eso ninguna tiene que responder por ella. Se puede hacer con cualquier tamaño de negocio y no exige tener caja. Si montas algo así, cuéntanos con un enlace y lo sumamos.", "d_en": "Several of these brands did not give their own money: they pledged a share, or all, of what they sold over a few days. And there is a lighter model, already working twice on this list: the money never passes through the brand. El Mono Bandido asks you to donate on the Red Cross page and sends you the shirt. Nine small brands together ask the same and raffle three kits among those who show their donation. None of them touches the money, so none of them has to answer for it. It works at any size and does not require cash on hand. If you set one up, send us a link and we will add it.", "tag": "mundo", "siempre": true, "a": "Escríbenos →", "a_en": "Write to us →", "f": "Idea recogida de las campañas ya verificadas aquí", "correo": true}]}};
  var RECURSOS = [{"n": "Si perdiste la casa, el trabajo o estás buscando a alguien", "n_en": "If you lost your home or your work, or you are looking for someone", "d": "Colombia se Levanta reúne albergues, arriendos y piezas que alguien presta sin cobrar, una bolsa de empleo sin hoja de vida, el registro de viviendas y negocios afectados, y la búsqueda de personas y animales. Todo sin crear cuenta. Publica también las cifras oficiales reconociendo que no coinciden entre sí. No dice quién lo opera, así que lo enlazamos como herramienta útil, no como aval.", "d_en": "Colombia se Levanta gathers shelters, rentals and rooms people lend for free, a job board with no CV required, a register of damaged homes and businesses, and searches for missing people and pets. All without creating an account. It also publishes the official figures while admitting they do not agree with each other. It does not say who runs it, so we link it as a useful tool, not as an endorsement.", "url": "https://colombiaselevanta.co/", "a": "Entrar →", "a_en": "Go there →", "f": "Revisado en el navegador el 16 de agosto de 2026"}, {"n": "Evaluación estructural gratis de tu vivienda", "n_en": "Free structural assessment of your home", "d": "Subes la dirección y fotos de los daños, y un ingeniero o arquitecto voluntario emite una evaluación técnica siguiendo ATC-20 y EMS-98. Llega por correo. Son orientaciones preliminares y no reemplazan la inspección oficial de la UNGRD, la Defensa Civil, los bomberos o tu municipio.", "d_en": "You upload your address and photos of the damage, and a volunteer engineer or architect issues a technical assessment following ATC-20 and EMS-98. It arrives by email. Preliminary guidance only; it does not replace official inspection by UNGRD, Civil Defence, the fire service or your municipality.", "url": "https://sismoayudaco.com/reportar", "a": "Reportar mi vivienda →", "a_en": "Report my home →", "f": "SismoAyuda Colombia · sitio oficial"}, {"n": "Asesoría jurídica gratuita en el Valle", "n_en": "Free legal advice in Valle del Cauca", "d": "La Gobernación del Valle con la Universidad Santiago de Cali atiende gratis daños en vivienda, reclamaciones a seguros, contratos y arriendos, y derechos de petición.", "d_en": "The Valle del Cauca government with Universidad Santiago de Cali gives free advice on home damage, insurance claims, contracts and tenancy, and formal petitions.", "url": "mailto:consuljuridico@usc.edu.co", "a": "consuljuridico@usc.edu.co →", "a_en": "consuljuridico@usc.edu.co →", "f": "Occidente"}, {"n": "Brigada jurídica gratuita", "n_en": "Free legal brigade", "d": "La firma Pérez-Llorca Gómez-Pinzón abrió asesoría gratuita en cinco áreas: seguros, laboral, inmobiliario, obligaciones bancarias y Registro Único de Damnificados.", "d_en": "The law firm Pérez-Llorca Gómez-Pinzón opened free advice in five areas: insurance, employment, property, bank obligations and the official disaster victims registry.", "url": "https://www.semana.com/economia/capsulas/articulo/firma-de-abogados-ofrece-asesoria-juridica-gratuita-a-los-afectados-por-el-terremoto/202608/", "a": "Ver la nota →", "a_en": "See the report →", "f": "Semana"}, {"n": "Si no puedes dormir o el cuerpo no se calma", "n_en": "If you cannot sleep or your body will not settle", "d": "El miedo, el insomnio y la tensión después de un sismo son respuestas esperadas, no un trastorno. En Bogotá la Línea 106 de la Secretaría Distrital de Salud atiende gratis las 24 horas, todos los días, también por WhatsApp al 300 754 8933. Desde cualquier parte del país el 123 es la línea única de emergencias y el 144 la de la Defensa Civil, y ninguna cobra.", "d_en": "Fear, insomnia and a body that will not settle after an earthquake are expected responses, not a disorder. In Bogotá, Línea 106 of the city health department is free, 24 hours, every day, also on WhatsApp at +57 300 754 8933. Anywhere in the country, 123 is the single emergency line and 144 is Civil Defence, and neither charges.", "url": "https://bogota.gov.co/mi-ciudad/salud/linea-106-para-apoyo-psicologico-y-mas-en-bogota-este-2025", "a": "Ver la Línea 106 →", "a_en": "See Línea 106 →", "f": "Alcaldía de Bogotá y Defensa Civil · la 106 es de Bogotá, no nacional"}, {"n": "Acompañamiento psicológico gratuito, virtual, desde cualquier parte", "n_en": "Free psychological support, online, from anywhere", "d": "PRAXIS Grupos Operativos Psicosociales, una red de psicólogas y psicólogos de varios países, abrió acompañamiento y primeros auxilios psicológicos gratuitos para quienes quedaron mal después del temblor. Es virtual y se pide por mensaje directo a su cuenta o al +52 55 3320 0457. Hicieron lo mismo tras los sismos de Venezuela en junio, así que no es algo improvisado para esta emergencia. El teléfono es mexicano porque la red es regional.", "d_en": "PRAXIS Grupos Operativos Psicosociales, a network of psychologists from several countries, opened free psychological first aid and support for people struggling after the quake. It is online and you ask for it by direct message to their account or on +52 55 3320 0457. They did the same after the Venezuela earthquakes in June, so it is not improvised for this emergency. The phone is Mexican because the network is regional.", "url": "https://www.instagram.com/praxis.go/", "a": "Escribirles →", "a_en": "Message them →", "f": "Publicación de la propia red para Colombia, revisada el 16 de agosto de 2026"}, {"n": "Atención veterinaria remota 24 horas", "n_en": "24-hour remote veterinary care", "d": "Fixit atiende consultas veterinarias remotas gratuitas todo el día. Teléfonos 333 602 5800 y 601 438 7525.", "d_en": "Fixit offers free remote veterinary consultations around the clock. Phones +57 333 602 5800 and +57 601 438 7525.", "url": "https://www.eltiempo.com/cultura/gente/como-donar-comida-y-otras-ayudas-para-los-animales-victimas-del-terremoto-en-colombia-3577903", "a": "Ver los teléfonos →", "a_en": "See the numbers →", "f": "El Tiempo"}, {"n": "Si alguien pide dinero haciéndose pasar por ti", "n_en": "If someone asks for money pretending to be you", "d": "Pasa después de cada emergencia: aparecen perfiles falsos usando el nombre o la foto de una familia afectada para recibir donaciones. Si te ocurre, publícalo desde tus propias cuentas y di cuál es tu único canal autorizado. Eso es lo que le permite a los demás distinguir. Y si te llega una colecta a nombre de alguien, contrástala con la cuenta de esa persona antes de mandar nada.", "d_en": "It happens after every emergency: fake profiles use an affected family's name or photo to collect donations. If it happens to you, post it from your own accounts and say which is your only authorised channel. That is what lets everyone else tell the difference. And if a fundraiser reaches you in someone's name, check it against that person's own account before sending anything.", "a": "", "a_en": "", "f": "Recomendación nuestra, no una noticia"}];
  var CONCIERTOS = [{"iso": "2026-08-18", "f": "Mar 18 ago · Envigado", "f_en": "Tue Aug 18 · Envigado", "nm": "Vallenatón por Colombia", "lug": "Centro de Eventos Centauro", "lug_en": "Centro de Eventos Centauro", "art": "Daniel Calderón, Jorge Celedón, Nelson Velásquez y 10 más", "art_en": "Daniel Calderón, Jorge Celedón, Nelson Velásquez and 10 more", "precio": "Apoyo a la emergencia", "precio_en": "Support for the emergency"}, {"iso": "2026-08-23", "f": "Dom 23 ago · Bogotá", "f_en": "Sun Aug 23 · Bogotá", "nm": "Colombia Voces por la Vida", "lug": "Vive Claro Distrito Cultural", "lug_en": "Vive Claro Distrito Cultural", "art": "Karol G, Andrés Cepeda, Miguel Bosé, Sebastián Yatra y 16 más", "art_en": "Karol G, Andrés Cepeda, Miguel Bosé, Sebastián Yatra and 16 more", "destino": "→ Presentes Corporación", "destino_en": "→ Presentes Corporación", "precio": "Reconstrucción de viviendas", "precio_en": "Rebuilding homes"}, {"iso": "2026-08-29", "f": "Sáb 29 ago · Bogotá", "f_en": "Sat Aug 29 · Bogotá", "nm": "Si nos organizamos cabemos todos", "lug": "Movistar Arena · 4:00 p.m.", "lug_en": "Movistar Arena · 4:00 p.m.", "art": "Carlos Vives, Feid, Kapo, Manuel Turizo, ChocQuibTown, Piso 21 y 6 más", "art_en": "Carlos Vives, Feid, Kapo, Manuel Turizo, ChocQuibTown, Piso 21 and 6 more", "destino": "→ 100% de la boletería a Fundación PLAN", "destino_en": "→ 100% of ticket sales to Fundación PLAN", "precio": "Desde $130.000 · Tuboleta", "precio_en": "From about US$42 (COP $130,000) · Tuboleta"}];
  var TRANSP = [{"q": "¿Quién está detrás de esto?", "q_en": "Who is behind this?", "a": "Mi nombre no importa. Soy un colombiano que vive lejos, y cuando pasó el terremoto sentí algo que quizá tú también sentiste: las ganas de ayudar y la impotencia de no saber cómo. Esa mezcla incómoda fue la que terminó en esta página. No la hice para que me lea nadie en particular. La hice para que quien esté sintiendo lo mismo encuentre por dónde empezar. Si te sirvió, pásala.", "a_en": "My name does not matter. I am a Colombian who lives far away, and when the earthquake hit I felt something you may have felt too: the will to help and the helplessness of not knowing how. That uncomfortable mix is what ended up as this page. I did not make it for anyone in particular to read. I made it so that whoever is feeling the same thing can find somewhere to start. If it helped you, pass it on.", "en_sitio": true}, {"q": "Esto se hizo rápido, y se nota", "q_en": "This was built fast, and it shows", "a": "Salió al aire en pocos días porque valía más servir a tiempo que salir completo. La consecuencia es que faltan cosas: fundaciones que no encontramos, empresas que están mandando camiones sin que la prensa lo cuente, colectas de barrio que nunca salieron en un medio. Que algo no esté aquí no significa que no exista ni que no sirva: significa que no lo hemos encontrado. Por eso el sitio tiene un correo abierto para que cualquiera sume lo que falta, con su enlace, y lo verificamos igual que todo lo demás.", "a_en": "It went live in a matter of days because being useful in time mattered more than being complete. The consequence is that things are missing: foundations we did not find, companies sending trucks with no press coverage, neighbourhood collections that never made the news. Something not being here does not mean it does not exist or does not work: it means we have not found it. That is why the site has an open inbox for anyone to add what is missing, with a link, and we verify it like everything else.", "en_sitio": true}];

      var c=reelCode(item.url); if(!c) return;
      var url='https://www.instagram.com/'+c.kind+'/'+c.code+'/';
      var w=el('div','reel');
      var marco=el('div','marco');
      marco.appendChild(el('div','esperando',esc(T[lang].reelsub)));
      w.appendChild(marco);
      // La portada la trae el propio iframe de Instagram: no guardamos ni
      // generamos imagenes de nadie. Se carga cuando la tarjeta esta por
      // entrar en pantalla, asi que quien nunca baja hasta aca no le carga
      // codigo a Meta.
      function cargar(){
        if(marco.dataset.cargado)return; marco.dataset.cargado='1';
        var f=document.createElement('iframe');
        f.src=url+'embed/'; f.loading='lazy'; f.allowFullscreen=true;
        f.setAttribute('scrolling','no'); f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
        f.title=item[lang]||item.es||'Instagram';
        marco.innerHTML=''; marco.appendChild(f);
      }
      w.appendChild(el('p','cap',esc(item[lang]||item.es||'')));
      var a=el('a','abrir',esc(T[lang].reelopen)+' →');
      a.href=url;a.target='_blank';a.rel='noopener';
      w.appendChild(a);
      box.appendChild(w);
      // Dos filtros antes de pedirle un video a Meta, en este orden:
      // 1. que el visitante haya bajado hasta la seccion (se arma abajo);
      // 2. que la tarjeta este a la vista dentro de la tira, que es horizontal.
      // El observador se monta DESPUES de insertar la tarjeta: si se monta
      // antes, todavia no es hija de la raiz y no dispara nunca. Ese error
      // dejo la tira sin cargar un solo video la primera vez.
      w._cargar = cargar;
    });
    armaCargaPerezosa(box);
    tiraControles();
  }

  // Nadie le pide nada a Instagram hasta que la seccion entra en pantalla.
  // Solo entonces se vigila la tira por dentro, para cargar el reel visible y
  // su vecino y ninguno mas.
  function armaCargaPerezosa(box){
    var hijos=[].slice.call(box.children);
    if(!('IntersectionObserver' in window)){ hijos.forEach(function(w){w._cargar()}); return; }
    function vigilaDentro(){
      var io=new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting && e.target._cargar){ io.unobserve(e.target); e.target._cargar(); } });
      },{root:box,rootMargin:'0px 320px'});
      hijos.forEach(function(w){io.observe(w)});
    }
    var puerta=new IntersectionObserver(function(es){
      if(es.some(function(e){return e.isIntersecting})){ puerta.disconnect(); vigilaDentro(); }
    },{rootMargin:'200px'});
    puerta.observe(box);
  }

  // Flechas y contador de la tira. En movil se pasa con el dedo y las flechas
  // se ocultan por CSS, pero el contador se sigue actualizando.
  function tiraControles(){
    var box=$('#reels'), izq=$('#reelizq'), der=$('#reelder'), cta=$('#reelcuenta');
    if(!box||!izq||!der) return;
    var total=box.children.length;
    if(!total){ var cab=document.querySelector('.reels-cab'); if(cab) cab.style.display='none'; return; }
    function paso(){ var uno=box.children[0]; return uno ? uno.getBoundingClientRect().width+18 : 300; }
    function pinta(){
      var i=Math.round(box.scrollLeft/paso())+1;
      cta.textContent=Math.min(Math.max(i,1),total)+' / '+total;
      izq.disabled = box.scrollLeft<=2;
      der.disabled = box.scrollLeft>=box.scrollWidth-box.clientWidth-2;
    }
    // El contador se repinta tambien despues de cada flecha, sin depender solo
    // del evento de desplazamiento, que con desplazamiento suave llega tarde.
    function mueve(d){ box.scrollBy({left:d*paso(),behavior:'smooth'}); setTimeout(pinta,450); setTimeout(pinta,900); }
    izq.onclick=function(){mueve(-1)};
    der.onclick=function(){mueve(1)};
    box.addEventListener('scroll',pinta,{passive:true});
    window.addEventListener('resize',pinta);
    pinta();
  }

      : 'Figures from Colombia’s national disaster agency (UNGRD) as of August 15, 2026. The epicentre was San José del Palmar, in Chocó, a department where 30.8% of people live in multidimensional poverty against a national average of 9.9%, <a href="https://www.dane.gov.co/files/operaciones/PM/bol-PMultidimensional-2025.pdf" target="_blank" rel="noopener">per the national statistics office</a>.';
  }

  function pintaEjes(){
    var box=$('#ejes');box.innerHTML='';
    EJES.forEach(function(e){
      var b=el('button','eje');
      b.setAttribute('aria-pressed',abierto===e.k?'true':'false');
      b.appendChild(el('span','mk',e.mk));
      b.appendChild(el('span','nm',esc(L(e,'nm'))));
      b.appendChild(el('span','ds',esc(L(e,'ds'))));
      b.addEventListener('click',function(ev){
        abierto = (abierto===e.k) ? null : e.k;
        pintaEjes();pintaPanel();
        if(ev.isTrusted&&abierto)$('#panel').scrollIntoView({behavior:'smooth',block:'nearest'});
      });
      box.appendChild(b);
    });
  }
  function pintaPanel(){
    var p=$('#panel');p.innerHTML='';
    if(!abierto)return;
    var d=OPC[abierto];
    var lista=(d.o||[]).slice();
    if(modo==='intl'){lista.sort(function(a,b){
      var A=(a.tag==='mundo'||a.siempre)?0:1,B=(b.tag==='mundo'||b.siempre)?0:1;return A-B;})}
    lista.forEach(function(o){
      var c=el('article','op'+(o.aviso?' aviso':''));
      c.appendChild(el('span','tg',esc(o.tag==='mundo'
        ?(lang==='es'?'Desde cualquier país':'From anywhere in the world')
        :(lang==='es'?'Presencial en Colombia':'In person, in Colombia'))));
      c.appendChild(el('h3',null,esc(L(o,'n'))));
      c.appendChild(el('p','d',esc(L(o,'d'))));
      var a=el('a','a',esc(L(o,'a')));
      if(o.url){a.href=o.url;a.target='_blank';a.rel='noopener'}
      else if(o.correo){a.href='mailto:'+CORREO+'?subject='+encodeURIComponent(T[lang].asu)+'&body='+encodeURIComponent(T[lang].bsu)}
      else if(o.copiar){
        a.href='#sumar';
        a.addEventListener('click',function(ev){
          if(!ev.isTrusted)return;
          ev.preventDefault();
          var u=location.href.split('#')[0];
          if(navigator.clipboard&&navigator.clipboard.writeText){
            navigator.clipboard.writeText(u).then(function(){a.textContent=lang==='es'?'Enlace copiado ✓':'Link copied ✓'},function(){a.textContent=u});
          } else { a.textContent=u; }
        });
      }
      c.appendChild(a);
      // Una tarjeta puede llevar varias marcas detras, como las campanas
      // colectivas. Se listan con su propio enlace: si la gente les compra,
      // la campana recoge mas. El texto se escapa como todo lo demas.
      if(o.marcas && o.marcas.length){
        var fila=el('p','marcas');
        o.marcas.forEach(function(m,i){
          if(i) fila.appendChild(document.createTextNode('  ·  '));
          var ml=el('a',null,esc(m.n));
          ml.href=m.url; ml.target='_blank'; ml.rel='noopener';
          fila.appendChild(ml);
        });
        c.appendChild(fila);
      }
      c.appendChild(el('span','f',esc(o.f)));
      p.appendChild(c);
    });
  }

  function pintaRecursos(){
    var box=$('#recursos');box.innerHTML='';
    RECURSOS.forEach(function(r){
      var c=el('article','re');
      c.appendChild(el('h3',null,esc(L(r,'n'))));
      c.appendChild(el('p',null,esc(L(r,'d'))));
