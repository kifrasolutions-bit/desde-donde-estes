<style>
  :root{
    --amarillo:#F2C230; --amarillo-claro:#FBE9AE; --amarillo-hondo:#8A6A0E; --amarillo-papel:#FDF6E2;
    --azul:#12356B; --tinta:#16203A; --tinta-2:#4A5670; --tinta-3:#8896B2;
    --rojo:#C4362B;
    --papel:#FBF8F1; --papel-2:#F3EDE0; --tarjeta:#FFFDF7;
    --linea:#E4DCCB; --linea-2:#CFC5AF;
    --verde-fondo:#E8F2EC; --verde-linea:#B9D5C6; --verde-tarjeta:#F4FAF6;
    --verde-hondo:#1F4A37; --verde:#2F6B4F; --verde-texto:#2A4A3A;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{margin:0;padding:0}
  body{background:var(--papel);color:var(--tinta);
    font:17px/1.55 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--tinta);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;text-decoration-color:var(--linea-2)}
  a:hover{color:var(--amarillo-hondo);text-decoration-color:var(--amarillo)}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--azul);outline-offset:3px}
  ::selection{background:var(--amarillo-claro);color:var(--tinta)}
  h1,h2,h3{margin:0;font-weight:400}
  [hidden]{display:none!important}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px}

  /* barra */
  .barra{position:sticky;top:0;z-index:40;background:var(--papel);border-bottom:1px solid var(--linea)}
  .barra .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-top:13px;padding-bottom:13px}
  .marca{text-decoration:none;display:flex;align-items:center;gap:10px;flex:none}
  .bandera{display:flex;flex-direction:column;width:20px;height:20px;flex:none}
  .bandera i{display:block}
  .bandera i:nth-child(1){height:50%;background:var(--amarillo)}
  .bandera i:nth-child(2){height:25%;background:var(--azul)}
  .bandera i:nth-child(3){height:25%;background:var(--rojo)}
  .marca .w{font-family:var(--serif);font-size:19px;display:flex;gap:5px}
  .marca .w i{font-style:normal}
  .marca .w i:nth-child(1){color:var(--amarillo-hondo)}
  .marca .w i:nth-child(2){color:var(--azul)}
  .marca .w i:nth-child(3){color:var(--rojo)}
  .relleno{flex:1}
  .sw{display:flex;gap:9px;align-items:baseline;font-size:14px}
  .sw button{border:0;background:transparent;padding:0 0 2px;cursor:pointer;color:var(--tinta-2);border-bottom:2px solid transparent}
  .sw button[aria-pressed="true"]{color:var(--tinta)}
  .sw.lang button[aria-pressed="true"]{border-bottom-color:var(--amarillo)}
  .sw.loc button[aria-pressed="true"]{border-bottom-color:var(--azul)}
  .sw .sep{color:var(--linea-2)}
  .afe-link{font-size:14px;color:var(--tinta-2);text-decoration:underline;text-underline-offset:4px;margin-right:16px;white-space:nowrap}
  .afe-link:hover{color:var(--tinta)}
  .cta{font-size:14.5px;padding:7px 15px;background:var(--amarillo);color:var(--tinta);text-decoration:none;white-space:nowrap}
  .cta:hover{color:var(--tinta)}

  .frescura{background:var(--amarillo-claro);border-bottom:1px solid var(--linea)}
  .frescura p{margin:0;padding:8px 24px;max-width:1200px;margin:0 auto;font-size:13.5px;color:var(--amarillo-hondo)}

  section{border-bottom:1px solid var(--linea);scroll-margin-top:74px}
  .banda{background:var(--papel-2)}
  .enc{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline;margin-bottom:30px}
  .enc h2{font-family:var(--serif);font-size:clamp(27px,3.4vw,38px);line-height:1.12}
  .enc p{margin:0;color:var(--tinta-2);font-size:15px}

  /* apertura */
  .top .wrap{padding-top:46px;padding-bottom:52px}
  .kicker{margin:0 0 20px;font-size:14px;color:var(--tinta-2);letter-spacing:.03em}
  .masthead{position:relative}
  .mapa{position:absolute;right:0;top:-6%;width:min(52%,560px);opacity:.42;pointer-events:none}
  .masthead h1{position:relative;font-family:var(--serif);font-size:clamp(58px,14vw,158px);line-height:.87;letter-spacing:-.03em}
  .masthead h1 span{display:block}
  .masthead h1 span:nth-child(1){color:var(--amarillo-hondo)}
  .masthead h1 span:nth-child(2){color:var(--azul);margin-left:7%}
  .masthead h1 span:nth-child(3){color:var(--rojo);margin-left:14%}
  .bajo{margin-top:clamp(34px,6vw,66px);display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,64px)}
  .cita{margin:0;flex:2 1 380px;font-family:var(--serif);font-size:clamp(22px,2.6vw,29px);line-height:1.38;border-left:3px solid var(--amarillo);padding-left:24px}
  .cita .firma{margin-top:20px;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15.5px;color:var(--tinta-2);line-height:1.5}
  .acc{flex:1 1 300px;display:flex;flex-direction:column;justify-content:flex-end;gap:22px}
  .acc .posib{margin:0;font-size:18px;line-height:1.6}
  .acc .fila{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .btn{padding:13px 20px;background:var(--tinta);color:var(--papel);text-decoration:none;font-size:15.5px;border:0;cursor:pointer;display:inline-block}
  .btn:hover{color:var(--papel);background:#22304f}
  .btn.am{background:var(--amarillo);color:var(--tinta)}
  .btn.am:hover{background:#e8b724;color:var(--tinta)}
  .btn.claro{background:transparent;border:1px solid var(--linea-2);color:var(--tinta)}
  .enlace{font-size:15.5px;color:var(--tinta-2)}

  /* cifras */
  .cifras{display:flex;flex-wrap:wrap;gap:26px clamp(24px,4vw,52px)}
  .cif{flex:1 1 210px;display:flex;flex-direction:column;gap:9px}
  .cif .n{font-family:var(--serif);font-size:clamp(40px,5vw,60px);line-height:.92;letter-spacing:-.02em}
  .cif .n small{font-size:.42em;letter-spacing:0}
  .cif .t{font-size:15.5px;line-height:1.45}
  .cif a{font-size:12.5px;color:var(--tinta-2)}

  /* cadena */
  .cadena .wrap{padding-top:52px;padding-bottom:56px}
  .enc.ancho{align-items:flex-end;gap:16px 40px;margin-bottom:26px}
  .enc.ancho h2{flex:1 1 340px;font-size:clamp(30px,4.4vw,50px);line-height:1.05;max-width:17ch}
  .enc.ancho p{flex:1 1 280px;font-size:15.5px;max-width:44ch}
  .filtros{display:flex;gap:20px;flex-wrap:wrap;font-size:14.5px;padding-bottom:12px}
  .filtros button{border:0;background:transparent;padding:0 0 4px;cursor:pointer;color:var(--tinta-2);border-bottom:2px solid transparent}
  .filtros button[aria-pressed="true"]{color:var(--tinta);border-bottom-color:var(--amarillo)}
  .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(274px,1fr));gap:16px}
  .ficha{position:relative;border:1px solid var(--linea);background:var(--tarjeta);padding:22px 20px 14px;display:flex;flex-direction:column;gap:9px}
  .ficha h3{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;line-height:1.45}
  .ficha .cifra{margin:0;font-family:var(--serif);font-size:22px;line-height:1.26}
  .ficha .que{margin:0;font-size:15px;line-height:1.5;color:var(--tinta-2);flex:1}
  .ficha .pie{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;padding-top:9px;border-top:1px solid var(--linea);font-size:12.5px;color:var(--tinta-2)}
  .ficha .pie a{color:var(--tinta-2)}
  .masbox{padding-top:18px}

  /* reels */
  .reels-cab{margin-top:52px;padding-top:20px;border-top:1px solid var(--linea);display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .reels-cab h3{margin:0;font-family:var(--serif);font-size:clamp(22px,2.4vw,30px);font-weight:400;line-height:1.15}
  .reels-cab p{margin:6px 0 0;font-size:14.5px;color:var(--tinta-2);max-width:52ch}
  .reels-nav{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .reels-nav .cuenta{font-size:13px;color:var(--tinta-2);min-width:46px;text-align:right}
  .reels-nav button{width:40px;height:40px;border:1px solid var(--linea-2);background:transparent;color:var(--tinta);font-size:15px;line-height:1;cursor:pointer}
  .reels-nav button:hover:not([disabled]){background:var(--papel-2)}
  .reels-nav button[disabled]{opacity:.3;cursor:default}
  .reels{margin-top:22px;display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:12px;scrollbar-width:thin}
  .reel{flex:0 0 300px;scroll-snap-align:start}
  @media(max-width:700px){.reel{flex:0 0 78vw}.reels-nav{display:none}}
  .reel .marco{position:relative;width:100%;aspect-ratio:4/5;background:var(--papel-2);border:1px solid var(--linea);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .reel .marco iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .reel .esperando{font-size:13px;color:var(--tinta-2);padding:16px;text-align:center}
  .reel .cap{margin:11px 0 0;font-size:14.5px;line-height:1.5;color:var(--tinta-2)}
  .reel .abrir{font-size:13px}

  /* fase */
  .fase{position:relative;padding-top:26px}
  .fase .riel{position:absolute;left:0;right:0;top:26px;height:2px;background:var(--linea)}
  .fase .avance{position:absolute;left:0;top:26px;height:2px;background:var(--amarillo)}
  .fase .pasos{position:relative;display:flex}
  .fase .p{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 8px}
  .fase .dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--papel);margin-top:-6px;background:var(--linea-2)}
  .fase .p.act .dot{background:var(--rojo)}
  .fase .num{font-size:12.5px;color:var(--tinta-2);font-family:var(--serif)}
  .fase .lbl{font-size:19px;font-family:var(--serif);line-height:1.2}
  .fase .aqui{font-size:13px;color:var(--amarillo-hondo)}
  .perdida{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(224px,1fr));gap:16px}
  .pf{position:relative;border:1px solid var(--linea);background:var(--tarjeta);padding:20px 18px 16px;display:flex;flex-direction:column;gap:7px}
  .pf .n{font-family:var(--serif);font-size:32px;line-height:1;color:var(--tinta-2)}
  .pf .t{font-size:14.5px;line-height:1.45;color:var(--tinta-2);flex:1}
  .pf .s{font-size:12.5px;color:var(--tinta-2);padding-top:8px;border-top:1px solid var(--linea)}
  .nota{margin:26px 0 0;font-size:14px;line-height:1.6;color:var(--tinta-2);max-width:78ch}

  /* sumar */
  .sumar{background:var(--amarillo-papel)}
  .sumar .wrap{padding-top:50px;padding-bottom:54px;display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,56px)}
  .sumar .izq{flex:1 1 300px}
  .sumar h2{font-family:var(--serif);font-size:clamp(28px,3.8vw,44px);line-height:1.08;max-width:15ch;margin-bottom:12px}
  .sumar .izq p{margin:0;color:var(--amarillo-hondo);font-size:15.5px;max-width:38ch}
  .sumar .der{flex:1.4 1 340px}
  .sumar .der .p1{margin:0 0 18px;font-size:17.5px;line-height:1.62}
  .sumar .der .p2{margin:0 0 24px;font-size:14.5px;line-height:1.6;color:var(--tinta-2)}

  /* puertas */
  .puertas{background:var(--papel-2)}
  .puertas .wrap{padding-top:52px;padding-bottom:58px}
  .puertas .enc{gap:14px 40px;align-items:flex-end;margin-bottom:32px}
  .puertas .enc h2{font-size:clamp(34px,5vw,62px);line-height:1}
  .puertas .enc p{font-size:15.5px;max-width:42ch}
  .ejes{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:12px;margin-bottom:20px}
  .eje{width:100%;height:100%;text-align:left;border:1px solid var(--linea-2);background:var(--papel);color:var(--tinta);padding:18px 18px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .eje .mk{font-size:12px;color:var(--tinta-2);font-family:var(--serif)}
  .eje .nm{font-size:20px;font-family:var(--serif)}
  .eje .ds{font-size:13.5px;line-height:1.4;color:var(--tinta-2)}
  .eje[aria-pressed="true"]{border-color:var(--tinta);background:var(--tinta);color:var(--papel)}
  .eje[aria-pressed="true"] .mk{color:var(--amarillo)}
  .eje[aria-pressed="true"] .ds{color:var(--linea)}
  .panel{border:1px solid var(--tinta);padding:clamp(16px,2.6vw,26px);display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:16px}
  .panel:empty{display:none}
  .op{border:1px solid var(--linea);background:var(--papel);padding:18px 18px 14px;display:flex;flex-direction:column;gap:9px}
  .op.aviso{border-color:var(--rojo)}
  .op .tg{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta-2)}
  .op h3{font-family:var(--serif);font-size:21px;line-height:1.2}
  .op .d{margin:0;font-size:15.5px;line-height:1.55;color:var(--tinta-2);flex:1}
  .op .a{align-self:flex-start;font-size:15px;color:var(--tinta);text-decoration-color:var(--amarillo);text-decoration-thickness:2px}
  .op .marcas{margin:12px 0 0;font-size:13.5px;line-height:1.9;color:var(--tinta-2);width:100%}
  .op .marcas a{color:var(--tinta);text-decoration:underline;text-underline-offset:3px}
  .op .marcas a:hover{background:var(--papel-2)}
  .op .f{font-size:12.5px;color:var(--tinta-2);padding-top:9px;border-top:1px solid var(--linea);width:100%}

  /* afectados */
  .afectado{background:var(--verde-fondo);border-bottom:1px solid var(--verde-linea)}
  .afectado .wrap{padding-top:50px;padding-bottom:54px}
  .afectado .enc{gap:14px 40px;align-items:flex-end;margin-bottom:26px}
  .afectado .enc h2{font-size:clamp(27px,3.6vw,42px);line-height:1.1;color:var(--verde-hondo);max-width:17ch}
  .afectado .enc p{color:var(--verde);font-size:15.5px;max-width:42ch}
  .recursos{display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:16px}
  .re{border:1px solid var(--verde-linea);background:var(--verde-tarjeta);padding:19px 18px 15px;display:flex;flex-direction:column;gap:9px}
  .re h3{font-family:var(--serif);font-size:20px;line-height:1.22;color:var(--verde-hondo)}
  .re p{margin:0;font-size:15px;line-height:1.55;color:var(--verde-texto);flex:1}
  .re a{align-self:flex-start;font-size:15px;color:var(--verde-hondo);text-decoration-color:var(--verde)}
  .re .f{font-size:12.5px;color:#3B5B4C;padding-top:9px;border-top:1px solid #D7E7DE;width:100%}

  /* brecha */
  .brecha .wrap{padding:50px 24px}
  .brecha h2{font-family:var(--serif);font-size:clamp(28px,4.2vw,46px);line-height:1.08;max-width:18ch;margin-bottom:10px}
  .brecha .sub{margin:0 0 34px;color:var(--tinta-2);font-size:15.5px;max-width:56ch}
  .medidor{display:flex;flex-wrap:wrap;gap:clamp(26px,5vw,60px)}
  .medidor .izq{flex:1 1 300px}
  .barra-med{display:flex;height:14px;border:1px solid var(--linea-2)}
  .barra-med i{display:block}
  .barra-med i:nth-child(1){width:5%;background:var(--amarillo)}
  .barra-med i:nth-child(2){width:95%;background:var(--papel)}
  .leyenda{display:flex;flex-direction:column;gap:8px;margin-top:12px;font-size:13.5px;color:var(--tinta-2);line-height:1.5}
  .leyenda span{max-width:52ch}
  .leyenda span:nth-child(1){border-left:3px solid var(--amarillo);padding-left:10px}
  .leyenda span:nth-child(2){border-left:3px solid var(--linea-2);padding-left:10px}
  .medidor .expl{flex:1.3 1 340px;margin:0;font-size:17.5px;line-height:1.62}

  /* conciertos */
  .conciertos .wrap{padding:50px 24px}
  .cc{display:grid;grid-template-columns:repeat(auto-fill,minmax(298px,1fr));gap:16px}
  .co{position:relative;border:1px solid var(--linea);background:var(--tarjeta);padding:22px 20px 16px;display:flex;flex-direction:column;gap:8px}
  .co .fch{font-size:13.5px;color:var(--rojo);letter-spacing:.03em}
  .co h3{font-family:var(--serif);font-size:24px;line-height:1.16}
  .co .lug{font-size:14.5px;color:var(--tinta-2)}
  .co .art{margin:0;font-size:14.8px;line-height:1.5;color:var(--tinta-2);flex:1}
  .co .ya{font-size:12.5px;color:var(--tinta-2);border:1px solid var(--linea-2);padding:2px 8px;align-self:flex-start;white-space:nowrap}
  .co .fin{padding-top:9px;border-top:1px solid var(--linea);display:flex;flex-direction:column;gap:3px}
  .co .fin .dst{font-size:14.5px}
  .co .fin .prc{font-size:13.5px;color:var(--tinta-2)}
  .co.pasado{opacity:.55}

  /* transparencia */
  .transp{background:var(--papel-2);border-bottom:0}
  .transp .wrap{padding-top:52px;padding-bottom:56px}
  .destacadas{display:flex;flex-wrap:wrap;gap:clamp(26px,5vw,60px);margin-bottom:38px}
  .destacadas article{flex:1 1 320px;max-width:56ch}
  .destacadas h3{font-family:var(--serif);font-size:24px;line-height:1.2;color:var(--amarillo-hondo);margin-bottom:12px}
  .destacadas p{margin:0;font-size:16.5px;line-height:1.66;color:#3A4560}
  .resto{border-top:1px solid var(--linea-2);max-width:80ch}
  .resto details{border-bottom:1px solid var(--linea)}
  .resto summary{cursor:pointer;padding:15px 0;font-size:16px;list-style:none}
  .resto summary::-webkit-details-marker{display:none}
  .resto summary::before{content:"+ ";color:var(--amarillo-hondo)}
  .resto details[open] summary::before{content:"− "}
  .resto p{margin:0 0 16px;font-size:15.5px;line-height:1.62;color:var(--tinta-2)}

  /* pie */
  .pie-sitio{background:var(--tinta);color:var(--papel-2)}
  .pie-sitio .wrap{padding:46px 24px 62px;display:flex;flex-wrap:wrap;gap:clamp(26px,4vw,58px);align-items:flex-start}
  .pie-sitio .col1{flex:1.4 1 320px;display:flex;flex-direction:column;gap:16px}
  .pie-sitio .rayita{height:4px;width:104px;background:linear-gradient(90deg,var(--amarillo) 0 50%,var(--azul) 50% 75%,var(--rojo) 75% 100%)}
  .pie-sitio p{margin:0;font-size:14.8px;line-height:1.62;color:#D8DBE4}
  .pie-sitio a{color:var(--amarillo-claro);text-decoration-color:var(--amarillo-hondo)}
  .pie-sitio a:hover{color:var(--amarillo);text-decoration-color:var(--amarillo)}
  .pie-sitio .col2{flex:1 1 260px}
  .pie-sitio h3{font-family:var(--serif);font-size:17px;color:var(--amarillo-claro);margin-bottom:10px}
  .pie-sitio .fuentes{font-size:14px;line-height:1.9;color:#D8DBE4}

  .pie-sitio .col1,.pie-sitio .col2{min-width:0}
  .pie-sitio .fuentes{overflow-wrap:anywhere}
  .pie-sitio .fuentes a,.pie-sitio .fuentes span{display:block;padding:2px 0}

  @media(max-width:640px){
    /* dedos, no punteros: los blancos de toque suben a 40px sin cambiar el
       tamano visible de la letra */
    .sw button{padding:9px 4px;font-size:13px}
    .sw{gap:6px}
    .sw.loc{order:3}
    .cta{order:4;font-size:13.5px;margin-left:auto}
    .afe-link{order:3;font-size:13px;margin-right:10px}
    .filtros{gap:14px}
    .filtros button{padding:6px 0 8px}
    .barra .wrap{gap:10px 14px}
    .cta{padding:10px 16px}
    .masthead h1 span:nth-child(2){margin-left:5%}
    .masthead h1 span:nth-child(3){margin-left:10%}
    .mapa{width:70%;opacity:.28;top:auto;bottom:-4%}
    .cita{padding-left:16px}
  }
</style>
</head>

    var m_es=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    var m_en=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return lang==='es' ? d.getDate()+' de '+m_es[d.getMonth()] : m_en[d.getMonth()]+' '+d.getDate();
  }
  // La base trae "cuando" en formatos mezclados: ISO, "15 de agosto de 2026",
  // "anunciado el 13...". Se normaliza a algo corto y legible, sin inventar
  // fechas: lo que no se entiende, se deja como vino.
  function cuandoCorto(v){
    if(!v) return '';
    v=String(v).trim();
    var iso=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(iso) return fdate(v);
    var esp=v.match(/(\d{1,2})\s+de\s+([a-zA-ZáéíóúÁÉÍÓÚ]+)/);
    if(esp){
      var meses={enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,setiembre:8,octubre:9,noviembre:10,diciembre:11};
      var mi=meses[esp[2].toLowerCase()];
      if(mi!=null) return fdate('2026-'+String(mi+1).padStart(2,'0')+'-'+String(esp[1]).padStart(2,'0'));
    }
    return v.length>26 ? '' : v;
  }

                    : T[lang].fresco.replace('{d}',fdate(VERIFICADO));

  function pasaFiltro(x){
    if(filtro==='col')return x.origen==='colombia';
    if(filtro==='ext')return x.origen==='exterior';
    if(filtro==='gente')return x.tipo==='persona'||x.tipo==='comunidad';

  // La cadena se baraja en cada visita. Con mas de setenta entradas, un orden
  // fijo condenaba a las mismas seis a ser las unicas que alguien ve. Pero
  // barajar a secas rompe la regla de variedad de la directiva: pueden caer
  // juntas tres multinacionales y la seccion se lee como un ranking. Por eso
  // despues de barajar se reacomoda para que dos vecinas no compartan tipo ni
  // origen. Se baraja una sola vez por carga, no en cada repintado, para que
  // cambiar de idioma o de filtro no reordene todo bajo el dedo de quien lee.
  var ORDEN = (function(){
    var a=H.slice(), i, j, tmp;
    for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); tmp=a[i]; a[i]=a[j]; a[j]=tmp; }
    for(i=1;i<a.length;i++){
      if(a[i].tipo===a[i-1].tipo || a[i].origen===a[i-1].origen){
        for(j=i+1;j<a.length;j++){
          if(a[j].tipo!==a[i-1].tipo && a[j].origen!==a[i-1].origen){
            tmp=a[i]; a[i]=a[j]; a[j]=tmp; break;
          }
        }
      }
    }
    return a;
  })();

        c.appendChild(cf);

      trozos.push('<a href="'+esc(x.fuente_url)+'" target="_blank" rel="noopener">'+esc(x.fuente_nombre)+'</a>');
      trozos.forEach(function(s,k){
        if(k)pie.appendChild(el('span',null,'·'));
        pie.appendChild(el('span',null,s));
      });
      c.appendChild(pie);
      g.appendChild(c);
    });
    var b=$('#masbtn');
    if(lista.length>tope){b.hidden=false;b.textContent=T[lang].mas+' ('+(lista.length-tope)+')'}
    else if(tope>12){b.hidden=false;b.textContent=T[lang].menos}
    else b.hidden=true;
  }

  function reelCode(u){
    var m=String(u).match(/instagram\.com\/(?:[A-Za-z0-9_.]+\/)?(reel|reels|p|tv)\/([A-Za-z0-9_-]+)/);
    return m?{kind:m[1]==='reels'?'reel':m[1],code:m[2]}:null;
  }
  function pintaReels(){
    var box=$('#reels');box.innerHTML='';
    (R.reels||[]).forEach(function(item){
      var c=reelCode(item.url); if(!c) return;
      var url='https://www.instagram.com/'+c.kind+'/'+c.code+'/';
      var w=el('div','reel');
      var marco=el('div','marco');
      marco.appendChild(el('div','esperando',esc(T[lang].reelsub)));
      w.appendChild(marco);
      // La portada la trae el propio iframe de Instagram: no guardamos ni
      // generamos imagenes de nadie. Se carga cuando la tarjeta esta por
      // entrar en pantalla, asi que quien nunca baja hasta aca no le carga
      // codigo a Meta.
      function cargar(){
        if(marco.dataset.cargado)return; marco.dataset.cargado='1';
        var f=document.createElement('iframe');
        f.src=url+'embed/'; f.loading='lazy'; f.allowFullscreen=true;
        f.setAttribute('scrolling','no'); f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
        f.title=item[lang]||item.es||'Instagram';
        marco.innerHTML=''; marco.appendChild(f);
      }
      w.appendChild(el('p','cap',esc(item[lang]||item.es||'')));
      var a=el('a','abrir',esc(T[lang].reelopen)+' →');
      a.href=url;a.target='_blank';a.rel='noopener';
      w.appendChild(a);
      box.appendChild(w);
      // Dos filtros antes de pedirle un video a Meta, en este orden:
      // 1. que el visitante haya bajado hasta la seccion (se arma abajo);
      // 2. que la tarjeta este a la vista dentro de la tira, que es horizontal.
      // El observador se monta DESPUES de insertar la tarjeta: si se monta
      // antes, todavia no es hija de la raiz y no dispara nunca. Ese error
      // dejo la tira sin cargar un solo video la primera vez.
      w._cargar = cargar;
    });
    armaCargaPerezosa(box);
    tiraControles();
  }

  // Nadie le pide nada a Instagram hasta que la seccion entra en pantalla.
  // Solo entonces se vigila la tira por dentro, para cargar el reel visible y
  // su vecino y ninguno mas.
  function armaCargaPerezosa(box){
    var hijos=[].slice.call(box.children);
    if(!('IntersectionObserver' in window)){ hijos.forEach(function(w){w._cargar()}); return; }
    function vigilaDentro(){
      var io=new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting && e.target._cargar){ io.unobserve(e.target); e.target._cargar(); } });
      },{root:box,rootMargin:'0px 320px'});
      hijos.forEach(function(w){io.observe(w)});
    }
    var puerta=new IntersectionObserver(function(es){
      if(es.some(function(e){return e.isIntersecting})){ puerta.disconnect(); vigilaDentro(); }
    },{rootMargin:'200px'});
    puerta.observe(box);
  }

  // Flechas y contador de la tira. En movil se pasa con el dedo y las flechas
  // se ocultan por CSS, pero el contador se sigue actualizando.
  function tiraControles(){
    var box=$('#reels'), izq=$('#reelizq'), der=$('#reelder'), cta=$('#reelcuenta');
    if(!box||!izq||!der) return;
    var total=box.children.length;
    if(!total){ var cab=document.querySelector('.reels-cab'); if(cab) cab.style.display='none'; return; }
    function paso(){ var uno=box.children[0]; return uno ? uno.getBoundingClientRect().width+18 : 300; }
    function pinta(){
      var i=Math.round(box.scrollLeft/paso())+1;
      cta.textContent=Math.min(Math.max(i,1),total)+' / '+total;
      izq.disabled = box.scrollLeft<=2;
      der.disabled = box.scrollLeft>=box.scrollWidth-box.clientWidth-2;
    }
    // El contador se repinta tambien despues de cada flecha, sin depender solo
    // del evento de desplazamiento, que con desplazamiento suave llega tarde.
    function mueve(d){ box.scrollBy({left:d*paso(),behavior:'smooth'}); setTimeout(pinta,450); setTimeout(pinta,900); }
    izq.onclick=function(){mueve(-1)};
    der.onclick=function(){mueve(1)};
    box.addEventListener('scroll',pinta,{passive:true});
    window.addEventListener('resize',pinta);
    pinta();
  }

    var p=$('#panel');p.innerHTML='';

      var A=(a.tag==='mundo'||a.siempre)?0:1,B=(b.tag==='mundo'||b.siempre)?0:1;return A-B;})}
    lista.forEach(function(o){
      var c=el('article','op'+(o.aviso?' aviso':''));
      c.appendChild(el('span','tg',esc(o.tag==='mundo'
        ?(lang==='es'?'Desde cualquier país':'From anywhere in the world')

      c.appendChild(el('p','d',esc(L(o,'d'))));

          } else { a.textContent=u; }
        });
      }
      c.appendChild(a);
      // Una tarjeta puede llevar varias marcas detras, como las campanas
      // colectivas. Se listan con su propio enlace: si la gente les compra,
      // la campana recoge mas. El texto se escapa como todo lo demas.
      if(o.marcas && o.marcas.length){

          fila.appendChild(ml);
        });
        c.appendChild(fila);
      }
      c.appendChild(el('span','f',esc(o.f)));
      p.appendChild(c);
    });
  }

    var U_REC='https://www.larepublica.co/especiales/catastrofe-nacional/la-reconstruccion-por-el-terremoto-costaria-us-6-350-millones-lo-que-equivale-a-1-del-pib-4457501';

  // Ubicacion por zona horaria, leida en el propio navegador. No sale ni un
  // dato del dispositivo: sin cookies, sin IP, sin terceros. Si no se puede
  // saber, se asume "fuera de Colombia", que es la version que funciona
  // desde cualquier parte.
  var enColombia=false;
  try{
    var tz=(Intl.DateTimeFormat().resolvedOptions().timeZone||'');
    enColombia = tz.indexOf('Bogota')!==-1;
  }catch(e){ enColombia=false; }
  modo = enColombia ? 'co' : 'intl';

  // El idioma arranca en espanol siempre, salvo un caso: que el navegador no
  // este en espanol Y ademas la zona horaria no sea la de Colombia. Muchos
  // colombianos tienen el telefono en ingles, y a alguien en Colombia el sitio
  // tiene que abrirle en espanol asi su celular este en otro idioma.
  var idiomaNavegador=(navigator.language||'').slice(0,2).toLowerCase();
  if(!enColombia && idiomaNavegador && idiomaNavegador!=='es') lang='en';

  aplica();aplicaModo();
})();
