name: Reconstruir, revisar enlaces y publicar

on:
  schedule:
    # Todos los días a las 12:00 UTC, o sea 7:00 a.m. en Colombia.
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hechos.json"
      - "contenido.json"
      - "reels.json"
      - "sitio-template.html"
      - "construir_sitio.py"
      - "update.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: sitio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruir el sitio, revisar enlaces y vigilar el USGS
        id: run
        continue-on-error: true
        run: python3 update.py | tee salida.txt

      - name: Guardar el sitio reconstruido
        run: |
          git config user.name  "actualizador"
          git config user.email "actions@users.noreply.github.com"
          git add sitio.html index.html
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Reconstrucción automática: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Abrir alerta si algo hay que revisar a mano
        if: steps.run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const salida = fs.readFileSync('salida.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Por revisar a mano — ${new Date().toISOString().slice(0,10)}`,
              body: [
                "El mantenimiento diario encontró algo que una persona tiene que mirar.",
                "",
                "Puede ser un enlace que dejó de responder, o que el USGS ya no coincide con lo que dice el sitio.",
                "",
                "**Un 403 casi siempre es el medio bloqueando robots, no un enlace muerto.** Ábrelo en el navegador antes de quitarlo.",
                "",
                "**Nada de esto se corrige solo.** Las cifras publicadas se cambian a mano, con su fuente.",
                "",
                "```",
                salida.slice(-6000),
                "```"
              ].join("\n")
            });

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
